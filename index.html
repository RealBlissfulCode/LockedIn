<!DOCTYPE html><html lang="en" data-theme="dark"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0A0A0C"><meta name="robots" content="noindex,nofollow"><title>LockedIn</title><meta name="description" content="Private."><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="LockedIn"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icons/icon-192.png"><link rel="icon" href="icons/icon.svg" type="image/svg+xml"><link rel="icon" href="icons/icon-192.png" sizes="192x192">
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap');
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
/* Palette follows jaronnorris.com: near-black ground, purple accent, monospace
   for anything numeric or structural. --brass is kept as the accent variable
   name so every existing rule picks the new colour up for free. */
:root{
--bg:#0A0A0C;--bg-2:#0E0E12;--panel:#131318;--panel-2:#1A1A21;--raise:#22222B;
--line:#26262F;--line-2:#33333F;
--ink:#EDEAF2;--ink-2:#B4B0BE;--ink-3:#8B8796;--ink-4:#5D5A68;
--brass:#A855F7;--brass-2:#C084FC;--amber:#E879C4;
--sage:#4ADE80;--steel:#60A5FA;--clay:#F87171;
--on-accent:#0A0A0C;
--r:10px;--r-s:7px;--r-l:16px;
--sh:0 1px 2px rgba(0,0,0,.5);
--sh-2:0 4px 16px rgba(0,0,0,.5);
--sh-3:0 18px 48px rgba(0,0,0,.65);
--glow:0 0 0 3px rgba(168,85,247,.16);
--ez:cubic-bezier(.2,.7,.3,1);
--f-body:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;
--f-disp:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
--f-mono:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;}
html[data-theme="light"]{
--bg:#FBFAFC;--bg-2:#F4F2F8;--panel:#FFFFFF;--panel-2:#F5F3F9;--raise:#EBE7F2;
--line:#E5E2EC;--line-2:#D2CDE0;
--ink:#17151C;--ink-2:#3D3948;--ink-3:#655F73;--ink-4:#918B9E;
--brass:#7E22CE;--brass-2:#9333EA;--amber:#BE1D8B;
--sage:#177245;--steel:#1D5FBF;--clay:#B91C1C;
--on-accent:#FFFFFF;
--sh:0 1px 2px rgba(23,21,28,.06);
--sh-2:0 4px 14px rgba(23,21,28,.10);
--sh-3:0 18px 48px rgba(23,21,28,.20);
--glow:0 0 0 3px rgba(126,34,206,.15);}
html[data-theme="light"] body{
background-image:radial-gradient(ellipse 900px 500px at 12% -6%,rgba(126,34,206,.07),transparent 60%),
radial-gradient(ellipse 700px 400px at 92% 2%,rgba(29,95,191,.05),transparent 60%);}
html[data-theme="light"] .top{background:rgba(251,250,252,.88)}
html[data-theme="light"] .btmnav{background:rgba(251,250,252,.96)}
html[data-theme="light"] .tab.on{color:#fff}
html[data-theme="light"] .b{color:#fff}
html[data-theme="light"] .b.o{color:var(--ink)}
html[data-theme="light"] .b.dz{color:var(--clay)}
html[data-theme="light"] .b.o:hover{color:var(--brass-2)}
html[data-theme="light"] .day.sel{background:rgba(126,34,206,.09)}
html[data-theme="light"] .day.sel .dev{color:var(--ink-2)}
html[data-theme="light"] .toast{color:#fff}
html[data-theme="light"] .pill.on{color:#fff}
html[data-theme="light"] .rcbadge{background:rgba(255,255,255,.9);color:var(--ink-2)}
html[data-theme="light"] .fav{background:rgba(255,255,255,.92)}
html[data-theme="light"] .aisle{background:var(--ink);color:#fff}
html[data-theme="light"] .aisle span{color:var(--brass-2)}
html[data-theme="light"] .stat.acc{background:linear-gradient(150deg,#F3E8FF,#EDE4FA)}
html[data-theme="light"] .dhero .scrim{
background:linear-gradient(to top,rgba(14,12,18,.92),rgba(14,12,18,.45) 55%,rgba(14,12,18,.2))}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth;background:var(--bg);transition:background .3s var(--ez)}
body{transition:background-color .3s var(--ez),color .3s var(--ez)}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.6 var(--f-body);padding-bottom:88px;
background-image:radial-gradient(ellipse 900px 500px at 12% -6%,rgba(168,85,247,.07),transparent 60%),
radial-gradient(ellipse 700px 400px at 92% 2%,rgba(96,165,250,.055),transparent 60%);
background-attachment:fixed}
a{color:var(--brass);text-decoration:none}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3,h4{margin:0;font-family:var(--f-disp);font-weight:600;letter-spacing:-.02em;line-height:1.14}
.wrap{max-width:1200px;margin:0 auto;padding:0 22px}
.lbl,.eyebrow{font:700 9.5px/1 var(--f-body);letter-spacing:.2em;text-transform:uppercase;color:var(--ink-4)}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}

/* top bar */
.top{position:sticky;top:0;z-index:60;background:rgba(10,10,12,.86);
backdrop-filter:saturate(150%) blur(16px);-webkit-backdrop-filter:saturate(150%) blur(16px);
border-bottom:1px solid var(--line)}
.topin{max-width:1200px;margin:0 auto;padding:12px 22px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;min-width:0}
.brand{flex:0 0 auto}
.tabs{flex:1 1 auto;justify-content:flex-end;flex-wrap:wrap}
.whoswitch{flex:0 0 auto}
.brand{font-family:var(--f-disp);font-weight:700;font-size:18px;letter-spacing:-.03em;color:var(--ink);
white-space:nowrap;display:flex;align-items:center;gap:9px}
.brand:before{content:"";width:8px;height:8px;border-radius:50%;background:var(--brass);
box-shadow:var(--glow),0 0 14px rgba(168,85,247,.5)}
.brand em{font-style:normal;color:var(--ink-3);font-weight:500}
.brand>span{display:inline-flex;letter-spacing:-.03em}
.tabs{display:flex;gap:2px;margin-left:auto}
.tab{background:none;border:0;color:var(--ink-3);font-weight:600;font-size:13px;padding:8px 14px;
border-radius:999px;cursor:pointer;transition:.2s var(--ez);white-space:nowrap}
.tab:hover{color:var(--ink);background:var(--panel-2)}
.tab.on{color:var(--bg);background:var(--brass)}
.iconbtn{background:var(--panel-2);border:1px solid var(--line);color:var(--ink-2);width:34px;height:34px;
border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:.2s var(--ez)}
.iconbtn:hover{border-color:var(--brass);color:var(--brass)}
.iconbtn svg{width:17px;height:17px}
.whoswitch{display:flex;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:3px;gap:2px}
.whoswitch button{background:none;border:0;color:var(--ink-3);font-weight:600;font-size:12.5px;
padding:6px 15px;border-radius:999px;cursor:pointer;transition:.22s var(--ez);white-space:nowrap}
.whoswitch button:hover{color:var(--ink)}
.whoswitch button.on{background:var(--raise);color:var(--ink);box-shadow:var(--sh);font-weight:700}
.whoswitch button.on:before{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;
background:var(--sage);margin-right:7px;vertical-align:middle}

/* bottom bar */
.btmnav{display:none;position:fixed;left:0;right:0;bottom:0;z-index:70;background:rgba(10,10,12,.95);
backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-top:1px solid var(--line);
padding:7px 4px calc(7px + env(safe-area-inset-bottom))}
.btmnav button{flex:1;background:none;border:0;padding:5px 2px;color:var(--ink-4);cursor:pointer;
display:flex;flex-direction:column;align-items:center;gap:4px;font:700 9px/1 var(--f-body);
letter-spacing:.08em;transition:.18s var(--ez);text-transform:uppercase}
.btmnav svg{width:20px;height:20px;stroke-width:1.6}
.btmnav button.on{color:var(--brass)}
.btmnav button.on svg{stroke-width:2}

/* page */
.page{animation:rise .4s var(--ez)}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.phead{padding:38px 0 22px;border-bottom:1px solid var(--line);margin-bottom:30px}
.phead h1,.phead p{max-width:68ch}
.phead h1{font-size:clamp(28px,4.2vw,44px);letter-spacing:-.035em}
.phead p{color:var(--ink-3);margin:10px 0 0;font-size:16px;line-height:1.55}
.sec{margin:40px 0}
.sec:first-child{margin-top:0}
/* Section header rhythm. A header always leaves the same gap before its
   content, whether or not it carries a subtitle or a row of buttons. Getting
   this wrong is what had action buttons sitting a few pixels off the card
   below them. */
.sec>h2,.sec>.spread{margin-bottom:18px}
.sec>h2+.sub,.sec>.spread+.sub{margin-top:-12px;margin-bottom:18px}
.sec>h2{font-size:21px;letter-spacing:-.028em;min-width:0;overflow-wrap:break-word}
.sec>.sub{color:var(--ink-3);font-size:13.5px;max-width:72ch}
.sec>.spread{align-items:center;gap:12px 18px}
/* Buttons in a section header answer to the heading, so they sit a step down
   from a primary action rather than competing with it. */
.sec>.spread .row{gap:8px}
.sec>.spread .b{padding:7px 14px;font-size:12.5px}
/* A toolbar under the page head, above the first block of content. */
.toolbar{margin-bottom:24px}
/* Card headings, instead of a hand-set font-size at every call site. */
.ctitle{font-size:15px;letter-spacing:-.01em;margin-bottom:14px;color:var(--ink)}
.stats+.note,.note+.stats{margin-top:16px}
.gap-b{margin-bottom:16px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh)}
.pad{padding:20px 22px}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(auto-fit,minmax(340px,1fr))}
.g3{grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
.g4{grid-template-columns:repeat(auto-fill,minmax(196px,1fr))}
.row{display:flex;gap:9px;flex-wrap:wrap;align-items:center;min-width:0}
.row>*{min-width:0}
.spread{flex-wrap:wrap}
.spread{display:flex;justify-content:space-between;align-items:center;gap:12px}
.muted{color:var(--ink-3)}.sm{font-size:13px}.xs{font-size:11.5px}
.right{margin-left:auto}
.hr{height:1px;background:var(--line);margin:26px 0}

/* stats */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));
background:var(--panel);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.stat{padding:16px 15px;border-right:1px solid var(--line)}
.stat:last-child{border-right:0}
.stat b{display:block;font-family:var(--f-mono);font-size:24px;font-weight:700;letter-spacing:-.03em;
line-height:1;color:var(--ink)}
.stat span{display:block;font:700 9px/1 var(--f-body);letter-spacing:.18em;text-transform:uppercase;
color:var(--ink-4);margin-top:8px}
.stat.acc{background:linear-gradient(150deg,#1E1330,#14101C)}
.stat.acc b{color:var(--brass);font-size:29px}
.stat.acc span{color:rgba(168,85,247,.62)}
.stat.good b{color:var(--sage)}
.stat.bad b{color:var(--clay)}

/* progress */
.mrow{margin-bottom:13px}.mrow:last-child{margin-bottom:0}
.mrow .spread{font-size:12.5px;font-weight:600;margin-bottom:6px}
.mrow .spread em{font-style:normal;color:var(--ink-3);font-weight:500;font-family:var(--f-mono)}
.bar{height:4px;background:var(--panel-2);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;transition:width .7s var(--ez)}
.pk{background:var(--brass)}.pp{background:var(--sage)}.pc{background:var(--amber)}.pf{background:var(--steel)}

/* buttons */
.b{border:1px solid var(--brass);background:var(--brass);color:var(--on-accent);font-weight:700;font-size:13.5px;
padding:9px 17px;border-radius:999px;cursor:pointer;transition:.2s var(--ez);display:inline-flex;
align-items:center;gap:7px;justify-content:center}
.b:hover{background:var(--brass-2);border-color:var(--brass-2);transform:translateY(-1px);box-shadow:var(--sh-2)}
.b:active{transform:none}
.b.o{background:transparent;color:var(--ink-2);border-color:var(--line-2);font-weight:600}
.b.o:hover{background:var(--panel-2);border-color:var(--brass);color:var(--brass)}
.b.s{padding:6px 12px;font-size:12px}
.b.dz{background:transparent;color:var(--clay);border-color:#4A2530}
.b.dz:hover{background:rgba(248,113,113,.12);border-color:var(--clay);color:var(--clay)}
.b:disabled{opacity:.4;cursor:not-allowed;transform:none}

/* fields */
.f{display:block;margin-bottom:13px}
.f>span{display:block;font:700 9.5px/1 var(--f-body);letter-spacing:.18em;text-transform:uppercase;
color:var(--ink-4);margin-bottom:6px}
.f input,.f select,.f textarea{width:100%;padding:10px 12px;border:1px solid var(--line-2);
border-radius:var(--r-s);background:var(--bg-2);color:var(--ink);font-weight:500;transition:.16s var(--ez)}
.f input:focus,.f select:focus,.f textarea:focus{outline:0;border-color:var(--brass);
box-shadow:var(--glow)}
.f textarea{resize:vertical;line-height:1.55}
.fr{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(155px,1fr))}

/* recipe cards */
.rc{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);
overflow:hidden;cursor:pointer;transition:.26s var(--ez);display:flex;flex-direction:column;box-shadow:var(--sh)}
.rc:hover{transform:translateY(-3px);box-shadow:var(--sh-2);border-color:var(--line-2)}
.rcart{height:126px;position:relative;overflow:hidden;background:var(--panel-2)}
.rcart img{width:100%;height:100%;object-fit:cover;display:block;transition:.5s var(--ez)}
.rc:hover .rcart img{transform:scale(1.05)}
.rcart .plate{position:absolute;inset:0;width:100%;height:100%;opacity:.5}
.rcart .ring{position:absolute;right:11px;bottom:10px}
.rcbadge{position:absolute;left:11px;top:11px;background:rgba(10,10,12,.72);color:var(--ink-2);
font:700 9px/1 var(--f-mono);letter-spacing:.1em;padding:5px 8px;border-radius:4px;
border:1px solid rgba(255,255,255,.1)}
.rcb{padding:14px 15px 15px;display:flex;flex-direction:column;flex:1}
.rcn{font-family:var(--f-disp);font-size:16px;font-weight:600;letter-spacing:-.02em;line-height:1.24;
color:var(--ink);margin-bottom:9px}
.chips{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:11px}
.chip{font:600 10.5px/1 var(--f-body);padding:5px 8px;border-radius:5px;background:var(--panel-2);
color:var(--ink-2);white-space:nowrap;border:1px solid var(--line)}
.chip.t{background:rgba(74,222,128,.14);color:var(--sage);border-color:rgba(74,222,128,.28)}
.chip.d1{background:rgba(74,222,128,.14);color:var(--sage);border-color:rgba(74,222,128,.28)}
.chip.d2{background:rgba(168,85,247,.13);color:var(--brass);border-color:rgba(168,85,247,.28)}
.chip.d3{background:rgba(248,113,113,.14);color:var(--clay);border-color:rgba(248,113,113,.3)}
.chip.p{font-family:var(--f-mono)}
.rcm{display:grid;grid-template-columns:repeat(4,1fr);margin-top:auto;border-top:1px solid var(--line);padding-top:11px}
.rcm div{text-align:center;border-right:1px solid var(--line)}
.rcm div:last-child{border-right:0}
.rcm b{display:block;font-family:var(--f-mono);font-size:15px;font-weight:700;color:var(--ink)}
.rcm span{font:700 8px/1 var(--f-body);letter-spacing:.14em;text-transform:uppercase;color:var(--ink-4);
display:block;margin-top:4px}
.fav{position:absolute;right:10px;top:10px;width:30px;height:30px;border-radius:50%;border:1px solid var(--line);
background:rgba(10,10,12,.72);color:var(--ink-4);font-size:14px;cursor:pointer;line-height:1;
display:flex;align-items:center;justify-content:center;transition:.22s var(--ez);z-index:2}
.fav:hover{transform:scale(1.12);border-color:var(--brass)}
.fav.on{color:var(--brass);border-color:var(--brass)}

/* detail */
.dhero{border-radius:var(--r-l);overflow:hidden;position:relative;min-height:250px;display:flex;
align-items:flex-end;color:var(--ink);padding:30px;border:1px solid var(--line)}
.dhero img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.dhero .scrim{position:absolute;inset:0;
background:linear-gradient(to top,rgba(8,9,10,.94),rgba(8,9,10,.45) 55%,rgba(8,9,10,.2))}
.dhero .in{position:relative;max-width:64ch}
.dhero h1{font-size:clamp(25px,3.8vw,38px);letter-spacing:-.032em;margin:8px 0 9px}
.ing{list-style:none;margin:0;padding:0}
.ing li{display:flex;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);font-size:14px;align-items:baseline}
.ing li:last-child{border-bottom:0}
.ing b{color:var(--ink);min-width:76px;font-family:var(--f-mono);font-weight:700}
.ing .c{margin-left:auto;color:var(--ink-4);font-size:12px;font-family:var(--f-mono)}
ol.stp{margin:0;padding:0;list-style:none;counter-reset:s}
ol.stp li{counter-increment:s;position:relative;padding:0 0 18px 44px;line-height:1.66;font-size:15px}
ol.stp li:before{content:counter(s);position:absolute;left:0;top:-1px;width:28px;height:28px;border-radius:50%;
background:var(--panel-2);border:1px solid var(--line-2);color:var(--brass);
font:700 12px/26px var(--f-mono);text-align:center}
ol.stp li:after{content:"";position:absolute;left:13.5px;top:32px;bottom:5px;width:1px;background:var(--line)}
ol.stp li:last-child{padding-bottom:0}ol.stp li:last-child:after{display:none}

/* table */
table{border-collapse:collapse;width:100%;font-size:13.5px}
th{background:var(--panel-2);color:var(--ink-3);text-align:left;font:700 9px/1 var(--f-body);
letter-spacing:.18em;text-transform:uppercase;padding:12px 13px;border-bottom:1px solid var(--line)}
td{padding:11px 13px;border-bottom:1px solid var(--line);color:var(--ink-2)}
td b{color:var(--ink)}
tbody tr:last-child td{border-bottom:0}
tbody tr:hover td{background:var(--panel-2)}
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch;border:1px solid var(--line);border-radius:var(--r);
background:var(--panel)}
.num{font-family:var(--f-mono);text-align:right}

/* calendar */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.cal .dow{text-align:center;font:700 9px/1 var(--f-body);letter-spacing:.18em;color:var(--ink-4);padding:7px 0}
.day{min-height:82px;border:1px solid var(--line);border-radius:var(--r-s);background:var(--panel);
padding:6px 7px;cursor:pointer;display:flex;flex-direction:column;transition:.18s var(--ez);
position:relative;overflow:hidden;text-align:left}
.day:hover{border-color:var(--brass);transform:translateY(-2px)}
.day.out{opacity:0;pointer-events:none}
.day.today{border-color:var(--line-2)}
.day.today .dn{color:var(--brass)}
.day.sel{background:rgba(168,85,247,.13);border-color:var(--brass);
box-shadow:inset 0 0 0 1px var(--brass)}
.day.sel .dn{color:var(--brass)}
.day.sel .dk{color:var(--brass-2)}
.dn{font-family:var(--f-mono);font-size:13px;font-weight:700;color:var(--ink)}
.dk{font:600 9px/1 var(--f-mono);color:var(--ink-4);margin-top:auto}
.devs{margin-top:5px;display:flex;flex-direction:column;gap:2px;overflow:hidden}
.dev{font:600 9.5px/1.25 var(--f-body);color:var(--ink-2);white-space:nowrap;overflow:hidden;
text-overflow:ellipsis;padding-left:8px;position:relative}
.dev:before{content:"";position:absolute;left:0;top:4px;width:4px;height:4px;border-radius:50%;background:var(--steel)}
.dev.w:before{background:var(--sage)}.dev.m:before{background:var(--amber)}
.day.sel .dev{color:var(--ink-2)}
.day.sel .dev:before{background:var(--brass)}
.dmore{font:600 9px/1 var(--f-body);color:var(--ink-4);padding-left:8px}
.dots{display:none;gap:3px;margin-top:4px;flex-wrap:wrap}
.dot{width:4px;height:4px;border-radius:50%;background:var(--brass)}
.dot.w{background:var(--sage)}.dot.e{background:var(--steel)}.dot.m{background:var(--amber)}

/* timeline */
.tl{list-style:none;margin:0;padding:0;position:relative}
.tl:before{content:"";position:absolute;left:58px;top:6px;bottom:6px;width:1px;background:var(--line)}
.tl li{display:flex;gap:16px;padding:10px 0;position:relative;align-items:flex-start}
.tl .tm{width:52px;flex:none;text-align:right;font:700 11px/1.5 var(--f-mono);color:var(--ink-3);padding-top:3px}
.tl .pip{position:absolute;left:55px;top:14px;width:7px;height:7px;border-radius:50%;
background:var(--brass);box-shadow:0 0 0 3px var(--panel)}
.tl .pip.w{background:var(--sage)}.tl .pip.e{background:var(--steel)}.tl .pip.m{background:var(--amber)}
.tl .bd{flex:1;min-width:0;padding-left:14px}

/* grocery */

.gitem input[type=checkbox]{width:18px;height:18px;accent-color:var(--brass);flex:none;cursor:pointer}
.gn{flex:1;min-width:0;font-size:14px;font-weight:600;color:var(--ink)}

.gp{font-family:var(--f-mono);font-weight:700;color:var(--brass);font-size:13.5px}

/* modal */
.mask{position:fixed;inset:0;background:rgba(6,5,10,.72);backdrop-filter:blur(5px);z-index:200;
display:flex;align-items:center;justify-content:center;padding:20px;animation:fadein .2s var(--ez)}
@keyframes fadein{from{opacity:0}to{opacity:1}}
.modal{background:var(--panel);border:1px solid var(--line-2);border-radius:var(--r-l);max-width:600px;
width:100%;max-height:88vh;display:flex;flex-direction:column;box-shadow:var(--sh-3);
animation:pop .28s var(--ez);overflow:hidden}
@keyframes pop{from{opacity:0;transform:scale(.96) translateY(12px)}to{opacity:1;transform:none}}
.mhead{padding:19px 22px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;
align-items:center}

.mbody{padding:20px 22px;overflow-y:auto}
.mfoot{padding:15px 22px;border-top:1px solid var(--line);display:flex;gap:9px;justify-content:flex-end;
background:var(--bg-2);flex-wrap:wrap}
.x{border:1px solid var(--line);background:var(--panel-2);width:30px;height:30px;border-radius:50%;
cursor:pointer;color:var(--ink-3);font-size:16px;line-height:1;transition:.18s var(--ez)}
.x:hover{background:var(--raise);color:var(--ink)}
.pickrow{display:flex;align-items:center;gap:12px;padding:11px;border-radius:var(--r-s);cursor:pointer;
border:1px solid transparent;transition:.16s var(--ez)}
.pickrow:hover{background:var(--panel-2);border-color:var(--line)}
.toast{position:fixed;left:50%;bottom:100px;transform:translateX(-50%);background:var(--brass);
color:var(--on-accent);padding:12px 22px;border-radius:999px;font-size:13.5px;font-weight:700;z-index:300;
box-shadow:var(--sh-3);animation:pop .26s var(--ez)}

/* error panel */
.errbox{background:rgba(248,113,113,.10);border:1px solid var(--clay);border-radius:var(--r);
padding:20px 22px;margin:24px 0}
.errbox h3{color:var(--clay);font-size:17px;margin-bottom:8px}
.errbox pre{background:var(--bg-2);border:1px solid var(--line);border-radius:var(--r-s);
padding:12px;overflow:auto;font:500 12px/1.5 var(--f-mono);color:var(--ink-2);margin:10px 0 0}

/* misc */
.pill{display:inline-block;background:var(--panel);color:var(--ink-2);border-radius:999px;padding:6px 14px;
font-size:12.5px;font-weight:600;cursor:pointer;border:1px solid var(--line);transition:.18s var(--ez)}
.pill:hover{border-color:var(--brass);color:var(--brass)}
.pill.on{background:var(--brass);color:var(--on-accent);border-color:var(--brass)}
.note{background:var(--panel);border:1px solid var(--line);border-left:2px solid var(--brass);
border-radius:0 var(--r-s) var(--r-s) 0;padding:15px 18px;font-size:14px;margin:15px 0;color:var(--ink-2)}
.note b{color:var(--ink);font-weight:600}
.note.warn{border-left-color:var(--clay)}
.note.good{border-left-color:var(--sage)}

details{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);margin-bottom:8px;
overflow:hidden;transition:.2s var(--ez)}
details[open]{border-color:var(--line-2)}
summary{padding:16px 20px;cursor:pointer;font-weight:600;font-size:15px;color:var(--ink);list-style:none;
display:flex;justify-content:space-between;align-items:center;gap:14px}
summary::-webkit-details-marker{display:none}
summary:after{content:"";width:8px;height:8px;border-right:1.6px solid var(--ink-4);
border-bottom:1.6px solid var(--ink-4);transform:rotate(45deg);flex:none;margin-top:-4px;transition:.24s var(--ez)}
details[open] summary:after{transform:rotate(-135deg);margin-top:2px}
details .dc{padding:2px 20px 18px;color:var(--ink-2)}
details .dc p{margin:0 0 11px}
details .dc p:last-child{margin-bottom:0}
details .dc ul{margin:0 0 11px;padding-left:18px}
.dirty{display:inline-flex;align-items:center;gap:6px;font:700 10px/1 var(--f-body);letter-spacing:.14em;
text-transform:uppercase;color:var(--clay);background:rgba(248,113,113,.12);border:1px solid rgba(248,113,113,.3);
padding:5px 10px;border-radius:999px}

/* ---------------------------------------------------------------- the gate */
/* Plain `center` clips the top of a box taller than the viewport and puts it out
   of scroll reach. flex-start is the fallback; `safe center` centres it only
   while it actually fits. */
#gate{position:fixed;inset:0;z-index:500;display:flex;align-items:flex-start;
align-items:safe center;justify-content:center;
padding:24px;background:var(--bg);
background-image:radial-gradient(ellipse 700px 460px at 50% 8%,rgba(168,85,247,.13),transparent 62%),
radial-gradient(ellipse 600px 400px at 50% 100%,rgba(96,165,250,.07),transparent 60%);
overflow-y:auto}
.gatebox{width:100%;max-width:340px;text-align:center;margin:0 auto;
padding:calc(env(safe-area-inset-top) + 8px) 0 calc(env(safe-area-inset-bottom) + 8px)}
.gatemark{width:52px;height:52px;margin:0 auto 20px;border-radius:15px;background:var(--panel);
border:1px solid var(--line-2);position:relative;box-shadow:var(--sh-2)}
/* A padlock, drawn from the two pseudo elements: shackle on top, body below. */
.gatemark:after{content:"";position:absolute;left:50%;top:13px;transform:translateX(-50%);
width:14px;height:11px;border:2px solid var(--brass);border-bottom:0;border-radius:7px 7px 0 0}
.gatemark:before{content:"";position:absolute;left:50%;top:22px;transform:translateX(-50%);
width:22px;height:17px;border-radius:3px;background:var(--brass);
box-shadow:0 0 14px rgba(168,85,247,.35)}
#gate h1{font-size:23px;letter-spacing:-.02em;color:var(--ink)}
.gsub{color:var(--ink-3);font-size:13.5px;margin:8px 0 26px}
.gdots{display:flex;justify-content:center;gap:13px;margin-bottom:26px;height:13px}
.gdots i{width:11px;height:11px;border-radius:50%;border:1.5px solid var(--line-2);
background:transparent;transition:.2s var(--ez)}
.gdots i.on{background:var(--brass);border-color:var(--brass);transform:scale(1.12);
box-shadow:0 0 12px rgba(168,85,247,.5)}
/* Real field, kept off screen. The dots are the display; this takes the typing. */
#gin{position:absolute;opacity:0;pointer-events:none;width:1px;height:1px;left:-9999px}
.gpad{display:grid;grid-template-columns:repeat(3,1fr);gap:11px}
.gpad button{aspect-ratio:1/1;min-height:56px;border-radius:50%;border:1px solid var(--line);
background:var(--panel);color:var(--ink);font:500 21px/1 var(--f-mono);cursor:pointer;
transition:.15s var(--ez);display:flex;align-items:center;justify-content:center}
.gpad button:hover{border-color:var(--brass);color:var(--brass)}
.gpad button:active{transform:scale(.94);background:var(--panel-2)}
.gpad .gghost{background:transparent;border-color:transparent;color:var(--ink-4);
font:600 12px/1 var(--f-body);letter-spacing:.1em;text-transform:uppercase}
.gpad .gghost:hover{color:var(--ink-2);border-color:transparent}
.gerr{color:var(--clay);font-size:13px;font-weight:600;margin:18px 0 0;min-height:19px}
.gnote{color:var(--ink-4);font-size:11.5px;line-height:1.55;margin:22px 0 0}
#gate.working{pointer-events:none}
#gate.working .gdots i{animation:gpulse 1s ease-in-out infinite}
#gate.working .gpad{opacity:.45}
@keyframes gpulse{0%,100%{opacity:.3}50%{opacity:1}}
.gatebox.shake{animation:gshake .38s var(--ez)}
@keyframes gshake{0%,100%{transform:translateX(0)}20%{transform:translateX(-9px)}
40%{transform:translateX(9px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
/* Landscape phones and short windows: shrink rather than scroll. */
@media (max-height:760px){
.gatemark{width:40px;height:40px;margin-bottom:12px;border-radius:12px}

.gatemark:before{top:17px;width:17px;height:13px}

body{padding-bottom:80px}

ol.stp li{padding-left:38px}

/* ---------------- switches ----------------

background:var(--ink-4);transition:.24s var(--ez)}
.sw.on{background:var(--brass);border-color:var(--brass)}
.sw.on i{transform:translateX(16px);background:var(--on-accent)}
.sw:hover{border-color:var(--brass)}
.sw:focus-visible{outline:0;box-shadow:var(--glow)}
.sw.xs{width:30px;height:17px}
.sw.xs i{width:11px;height:11px}
.sw.xs.on i{transform:translateX(13px)}
/* A switched off row keeps its numbers readable. Fade it to nothing and you
   have hidden the figure you were trying to decide about. */
tr.offrow{transition:opacity .24s var(--ez)}
tr.offrow>td{opacity:.44}
tr.offrow>td:first-child{opacity:1}
tr.offrow .chip{opacity:.75}
.offtag{font:700 9px/1 var(--f-body);letter-spacing:.14em;text-transform:uppercase;
color:var(--ink-4);margin-left:7px;vertical-align:1px}

/* ---------------- charts ---------------- */
.cempty{padding:26px 4px;text-align:center;color:var(--ink-4);font-size:12.5px}
.cchart{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:8px;align-items:end}
.ccol{min-width:0;text-align:center}
.cstack{position:relative;height:var(--ch,150px);border-bottom:1px solid var(--line)}
.cb{position:absolute;left:var(--l,8%);right:var(--r,8%);bottom:var(--b,0);height:var(--h,0);
border-radius:4px 4px 0 0;transform-origin:bottom;
animation:cgrow .58s var(--ez) both;animation-delay:var(--d,0s)}
@keyframes cgrow{from{transform:scaleY(0);opacity:.3}to{transform:scaleY(1);opacity:1}}
/* The waterfall connector. It reaches back past the column's own edge into
   the grid gap so the run from one bar top to the next is unbroken. It is
   written before the bars, so a bar always covers the stretch of line that
   would otherwise show underneath it. */
.cconn{position:absolute;left:-13px;right:var(--r,8%);bottom:var(--y,0);height:0;
border-top:1px dashed var(--line-2);
animation:cfade .45s var(--ez) both;animation-delay:var(--d,0s)}
.cchart.wf .cstack{overflow:visible}
.clab{margin-top:9px;font:600 10.5px/1.3 var(--f-body);color:var(--ink-3);
overflow-wrap:break-word;hyphens:auto}
.csub{margin-top:4px;font:700 12px/1 var(--f-mono);color:var(--ink)}
.csub.good{color:var(--sage)}.csub.bad{color:var(--clay)}
.ct1{background:var(--brass)}.ct2{background:var(--sage)}.ct3{background:var(--steel)}
.ct4{background:var(--amber)}.ct5{background:var(--clay)}.ct6{background:var(--ink-4)}
.ctg{background:var(--sage)}.ctb{background:var(--clay)}.ctm{background:var(--line-2)}

.cdonut{position:relative;width:100%;max-width:210px;margin:0 auto}
.cdonut svg{display:block;width:100%;height:auto}
.cdonut circle{fill:none;stroke-width:13}
.cdtrack{stroke:var(--panel-2)}
.cdseg{stroke-linecap:butt;stroke-dasharray:var(--len) 100;
animation:cdsweep .78s var(--ez) both;animation-delay:var(--d,0s)}
@keyframes cdsweep{from{stroke-dasharray:0 100}to{stroke-dasharray:var(--len) 100}}
.cdseg.ct1{stroke:var(--brass)}.cdseg.ct2{stroke:var(--sage)}.cdseg.ct3{stroke:var(--steel)}
.cdseg.ct4{stroke:var(--amber)}.cdseg.ct5{stroke:var(--clay)}.cdseg.ct6{stroke:var(--ink-4)}
.cdmid{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;
justify-content:center;pointer-events:none;text-align:center;padding:0 22px}
.cdmid b{font:700 21px/1 var(--f-mono);letter-spacing:-.03em;color:var(--ink)}
.cdmid span{margin-top:6px;font:700 8.5px/1 var(--f-body);letter-spacing:.18em;
text-transform:uppercase;color:var(--ink-4)}

.cline{display:block;width:100%;height:auto;overflow:visible}
.cpath{fill:none;stroke:var(--brass);stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;
stroke-dasharray:1;animation:cdraw 1s var(--ez) both}
@keyframes cdraw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
.carea{fill:url(#cgFill);stroke:none;animation:cfade .9s var(--ez) both;animation-delay:.25s}
@keyframes cfade{from{opacity:0}to{opacity:1}}
.cgs0{stop-color:var(--brass);stop-opacity:.28}
.cgs1{stop-color:var(--brass);stop-opacity:0}
.cline.neg .cpath{stroke:var(--clay)}
.cline.neg .cgs0{stop-color:var(--clay)}
.cline.neg .cgs1{stop-color:var(--clay)}
.czero{stroke:var(--line-2);stroke-width:1;stroke-dasharray:4 4}
.cdot{fill:var(--brass);stroke:var(--panel);stroke-width:1.6;
animation:cpop .3s var(--ez) both;animation-delay:var(--d,0s)}
.cline.neg .cdot{fill:var(--clay)}
@keyframes cpop{from{transform:scale(0);opacity:0}to{transform:scale(1);opacity:1}}
.caxis{display:flex;justify-content:space-between;margin-top:8px;
font:600 10.5px/1 var(--f-body);color:var(--ink-4)}

.cleg{margin-top:16px}
.clrow{display:flex;align-items:center;gap:9px;padding:7px 0;border-top:1px solid var(--line);
font-size:13px;transition:opacity .24s var(--ez)}
.clrow:first-child{border-top:0}
.clrow.off{opacity:.45}
.cdotc{width:9px;height:9px;border-radius:2.5px;flex:none}
.cln{flex:1 1 auto;min-width:0;overflow-wrap:break-word}
.clv{font-family:var(--f-mono);font-weight:700;font-size:12.5px}
.clp{font-family:var(--f-mono);font-size:11px;color:var(--ink-4);width:38px;text-align:right}
.ckey{display:flex;flex-wrap:wrap;gap:7px 15px;margin-top:14px;
font:600 11px/1 var(--f-body);color:var(--ink-3)}
.ckey span{display:inline-flex;align-items:center;gap:6px}
.ckey i{width:9px;height:9px;border-radius:2.5px;display:block}
/* Redrawing because a switch moved should not slide the page in again. The
   charts still replay, and that is the part carrying the change. */
.page.noanim{animation:none}
@media (max-width:560px){
.cchart{gap:5px}
.clab{font-size:9.5px}
.csub{font-size:11px}
}


/* ---------------- sign in ----------------
   The gate box was built for a keypad. It now holds a Google button, an invite
   code, or an error, so it needs to breathe a bit more than it did. */
.gbtn{display:flex;justify-content:center;margin:22px 0 6px;min-height:44px}
.gwait{font:600 13px/1 var(--f-body);color:var(--ink-3);padding:13px}
.glink{background:none;border:0;color:var(--ink-3);font:600 12.5px/1 var(--f-body);
cursor:pointer;padding:10px;margin-top:6px;text-decoration:underline;
text-underline-offset:3px}
.glink:hover{color:var(--brass)}
.gcode{width:100%;margin:18px 0 4px;padding:14px;text-align:center;
font:700 22px/1 var(--f-mono);letter-spacing:.32em;text-indent:.32em;
border:1px solid var(--line-2);border-radius:var(--r);background:var(--bg-2);color:var(--ink)}
.gcode:focus{outline:0;border-color:var(--brass);box-shadow:var(--glow)}
.gfound{padding:13px;border:1px solid var(--line);border-radius:var(--r);
background:var(--panel-2);margin-top:12px}
.gfound b{display:block;font-size:15px}
.gfound span{display:block;font-size:12px;color:var(--ink-3);margin-top:3px}

/* An invite code is read out loud and typed on a phone, so it gets spacing. */
.invcode{font-family:var(--f-mono);letter-spacing:.14em}
.invbig{font:700 30px/1 var(--f-mono);letter-spacing:.22em;text-align:center;
padding:22px 10px;margin:16px 0;border:1px dashed var(--line-2);border-radius:var(--r);
background:var(--panel-2);color:var(--brass);word-break:break-all}

/* Signing up is the one screen with no app behind it yet, so everything that
   navigates gets out of the way. */
body.signup .tabs,body.signup .btmnav,body.signup .whoswitch,
body.signup #syncSlot,body.signup #settings{display:none}
body.signup{padding-bottom:20px}
body.signup .wrap{padding-top:34px}

/* ---------------- signup wizard ----------------
   Same components as the rest of the app, just given room. Somebody is doing
   this once and every question has to look answerable. */
.setup{max-width:720px;margin:0 auto}
.setuphead{margin-bottom:26px}
.setuphead h1{font-size:29px;letter-spacing:-.03em;margin:0 0 8px}
.setuphead p{color:var(--ink-3);margin:0;max-width:62ch}
.setupbar{height:3px;background:var(--panel-2);border-radius:99px;overflow:hidden;margin-bottom:16px}
.setupbar i{display:block;height:100%;background:var(--brass);border-radius:99px;
transition:width .45s var(--ez)}
.setupstep{font:700 9.5px/1 var(--f-body);letter-spacing:.2em;text-transform:uppercase;
color:var(--ink-4);margin:0 0 10px}
.setupfoot{display:flex;gap:10px;justify-content:flex-end;margin-top:30px;
padding-top:20px;border-top:1px solid var(--line)}
.picks{display:grid;gap:9px;grid-template-columns:repeat(auto-fit,minmax(216px,1fr))}
.pick{text-align:left;padding:14px 16px;border:1px solid var(--line-2);border-radius:var(--r);
background:var(--panel);cursor:pointer;transition:.18s var(--ez);color:var(--ink)}
.pick:hover{border-color:var(--brass);transform:translateY(-1px)}
.pick b{display:block;font-size:14px;font-weight:600}
.pick span{display:block;font-size:12px;color:var(--ink-3);margin-top:4px;line-height:1.45}
.pick.on{border-color:var(--brass);background:var(--panel-2);box-shadow:var(--glow)}
.pick.on b{color:var(--brass)}
@media (max-width:560px){
.setuphead h1{font-size:23px}
.picks{grid-template-columns:1fr}
}

@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

      return {id:uid(),who:x.who,what:x.what,where:x.where||'',

    S.sched.cols.push({id:uid(),name:'My week',

}

/* ---------------- schedule templates ----------------
   A template is a named set of items keyed by weekday. It can be applied once
   over a range, or left standing, in which case its items are computed when a
   day is drawn rather than copied in. Standing beats copying: turning one off
   clears it everywhere at once and there are never stale duplicates to hunt. */
var REPEATS=[['weekly','Every week'],['biweekly','Every other week'],
             ['monthly','Once a month, same week'],['once','Only when I apply it']];
var SCOPES=[['week','This week'],['month','This month'],
            ['next4','The next 4 weeks'],['next3m','The next 3 months']];
function tmplCols(){ return (S.sched&&S.sched.cols)||[]; }
function tmplCol(id){var c=tmplCols().filter(function(x){return x.id===id;});return c[0]||null;}
function tmplCount(c){var n=0;for(var i=0;i<7;i++)n+=((c.days||{})[i]||[]).length;return n;}
function weekStart(d){var x=new Date(d.getFullYear(),d.getMonth(),d.getDate());
  x.setDate(x.getDate()-x.getDay());return x;}
function tmplMatches(c,ds){
  var d=dOf(ds), wd=d.getDay();
  if(!((c.days||{})[wd]||[]).length) return false;
  var rep=c.repeat||'weekly';
  if(rep==='once') return false;
  if(rep==='weekly') return true;
  var anchor=dOf(c.anchor||ds);
  if(rep==='biweekly'){
    var wk=Math.round((weekStart(d)-weekStart(anchor))/604800000);
    return ((wk%2)+2)%2===0;
  }
  /* "Same week of the month" as the anchor, so a first-Sunday thing stays a
     first-Sunday thing rather than drifting by date. */
  if(rep==='monthly') return Math.ceil(d.getDate()/7)===Math.ceil(anchor.getDate()/7);
  return true;
}
function tmplItemsFor(ds){
  var out=[], wd=dOf(ds).getDay(), log=S.days[ds];
  tmplCols().forEach(function(c){
    if(!c.active||!tmplMatches(c,ds)) return;
    ((c.days||{})[wd]||[]).forEach(function(x){
      /* Already applied by hand on this day: show it once, not twice. */
      if(log&&(log.sched||[]).some(function(e){
        return e.what===x.what&&e.who===x.who&&(e.from||'')===(x.from||'');})) return;
      out.push({who:x.who,what:x.what,where:x.where||'',
                from:x.from||'',to:x.to||'',col:c.name});
    });
  });
  return out;
}
function applyCollection(id,scope){
  var c=tmplCol(id); if(!c) return 0;
  var now=new Date(), start, end;
  if(scope==='month'){ start=new Date(calY,calM,1); end=new Date(calY,calM+1,0); }
  else if(scope==='next4'){ start=new Date(now); end=new Date(now); end.setDate(end.getDate()+27); }
  else if(scope==='next3m'){ start=new Date(now); end=new Date(now); end.setMonth(end.getMonth()+3); }
  else { start=new Date(now); start.setDate(start.getDate()-start.getDay());
         end=new Date(start); end.setDate(start.getDate()+6); }
  var n=0, cur=new Date(start);
  while(cur<=end){
    var ds=cur.getFullYear()+'-'+p2(cur.getMonth()+1)+'-'+p2(cur.getDate());
    /* A one-off template has no schedule of its own, so applying it just means
       "every matching weekday in this range". */
    if(c.repeat==='once'||tmplMatches(c,ds)){
      var items=((c.days||{})[cur.getDay()]||[]), log=dayLog(ds);
      for(var i=0;i<items.length;i++){
        var x=items[i];
        var dupe=log.sched.some(function(e){
          return e.what===x.what&&e.who===x.who&&(e.from||'')===(x.from||'');});
        if(!dupe){log.sched.push({who:x.who,what:x.what,from:x.from,to:x.to,
          where:x.where||''});n++;}
      }
    }
    cur.setDate(cur.getDate()+1);
  }
  if(n) save();
  return n;
}

/* ---------------- who is who ----------------
   The app used to know about exactly two people, stored as prof.j and prof.a,
   with rows tagged 'Jaron', 'Aaliyah' or 'Both'. That worked for one household
   and nothing else. Now a household is a list of members, each with an id, and
   a row is tagged with that id or with 'all' for something shared.

   Everything user facing goes through WHO so renaming somebody updates the
   whole app at once, and nothing stored ever holds a name. */
var EVERYONE='all';
function MEMS(){return S.members||[];}
function MEM(id){
  var m=MEMS();
  for(var i=0;i<m.length;i++) if(m[i].id===id) return m[i];
  return null;
}
function firstMember(){var m=MEMS();return m.length?m[0]:null;}
/* Whoever is selected up top is the default actor for anything logged. If the
   selection points at somebody who has since been removed, fall back rather
   than handing every caller a null. */
function ME(){
  if(S.who&&MEM(S.who)) return S.who;
  var f=firstMember();
  return f?f.id:null;
}
function P(){return MEM(ME())||blankMember();}
function WHO(tok){
  if(tok===EVERYONE) return MEMS().length>2?'Everyone':'Both of us';
  var m=MEM(tok);
  return m?m.name:'';
}
function MENAME(){return WHO(ME());}
function whoOpts(){
  var o=MEMS().map(function(m){return [m.id,m.name];});
  if(MEMS().length>1) o.push([EVERYONE,MEMS().length>2?'Everyone':'Both of us']);
  return o;
}
/* Only ever true when there is somebody else to share with, so a solo account
   never sees a Who dropdown offering to split things with nobody. */
function shared(){return MEMS().length>1;}
/* Every token a row can be tagged with, members first and the shared bucket
   last, for anything that groups by person. */
function whoTokens(){
  return MEMS().map(function(m){return m.id;}).concat([EVERYONE]);

function best(q){ if(!q) return 0;
  var w=q.w,c=q.c;
  if(c!=null&&c>0&&(w==null||w<=0||c<w)) return c;

  var w=q.w,c=q.c;

/* recipe cost is always recomputed from live ingredient prices, so an
   edited price flows straight through to every recipe that uses it */
function rcost(r){

/* ---------------- nutrition ---------------- */
function calc(p){
  var kg=p.w*0.45359237, cm=p.h*2.54, m=cm/100, lbm=kg*(1-p.bf/100);
  var rmr=(10*kg)+(6.25*cm)-(5*p.age)+(p.sex==='f'?-161:5);
  var tdee=rmr*p.act, kcal=tdee*p.goal;
  var prot=p.w*p.pf, fat=kcal*0.25/9, carb=(kcal-prot*4-fat*9)/4;
  return {rmr:Math.round(rmr),katch:Math.round(370+21.6*lbm),tdee:Math.round(tdee),
    kcal:Math.round(kcal),p:Math.round(prot),c:Math.round(carb),f:Math.round(fat),
    fib:Math.round(kcal/1000*14),w:Math.round(p.w*0.6+35),lbm:Math.round(p.w*(1-p.bf/100)),
    ffmi:(lbm/(m*m)+6.1*(1.8-m)).toFixed(1),rate:(kcal-tdee)*7/3500};
}
var TRAIN={

function dayLog(ds){ if(!S.days[ds]) S.days[ds]={workout:'rest',meals:[],notes:'',w:null,sched:[],spend:[]};
  var d=S.days[ds]; if(!d.sched)d.sched=[]; if(!d.spend)d.spend=[]; return d;}
/* who is a member id. A member who has not filled in their body stats yet gets
   the neutral defaults rather than a division by nothing, so the meals page
   still works on day one. */
function dayTarget(who,tt){
  var m=MEM(who)||P();
  var b=calc(m), t=TRAIN[tt||'rest'];
  var kcal=Math.round(b.kcal*t.k), pr=Math.round(b.p*t.p), cb=Math.round(b.c*t.c);
  var ft=Math.round((kcal-pr*4-cb*4)/9), floor=Math.round((m.w||150)*0.3);
  if(ft<floor){ft=floor;cb=Math.round((kcal-pr*4-ft*9)/4);}

  d.meals.forEach(function(m){var r=byId(m.id);if(!r)return;var q=m.q||1;
    o.kcal+=r.k*q;o.p+=r.p*q;o.c+=r.c*q;o.f+=r.f*q;o.fib+=(r.fib||0)*q;o.cost+=cps(r)*q;});

/* cost per macro: what a day of these targets actually costs, from real recipes */
function costModel(){
  var A=all().filter(function(r){return r.k>60;});
  var pk=0,pp=0,n=0;
  A.forEach(function(r){var c=cps(r); if(c<=0)return;
    pk+=c/r.k; pp+=(r.p>0?c/r.p:0); n++;});
  return {perKcal:pk/n, perProtein:pp/n, n:n};
}
function estDayCost(t,mode){
  var A=all().filter(function(r){return r.k>60;});
  if(mode==='fav'&&S.fav.length) A=S.fav.map(byId).filter(Boolean);
  if(mode==='cheap') A=A.slice().sort(function(a,b){return (cps(a)/a.k)-(cps(b)/b.k);}).slice(0,40);
  if(mode==='logged'){
    var days=Object.keys(S.days).filter(function(d){return S.days[d].meals.length;});
    if(days.length){var c=0,k=0;
      days.forEach(function(d){var e=eaten(d);c+=e.cost;k+=e.kcal;});
      if(k>0) return {byKcal:t.kcal*(c/k), byProt:null, src:days.length+' logged days'};}
  }
  if(!A.length) A=all();

  A.forEach(function(r){var c=cps(r);if(c<=0)return;pk+=c/r.k;n++;
    if(r.p>3){pp+=c/r.p;np++;}});
  return {byKcal:t.kcal*(pk/Math.max(n,1)), byProt:t.p*(pp/Math.max(np,1)),
          src:(mode==='fav'?'favourites':mode==='cheap'?'the 40 cheapest per calorie':'all '+n+' recipes')};
}

/* ============================================================
   CHARTS. Hand rolled. No library, no canvas.

   Most of them are plain HTML. A div with a percentage height is already a
   bar, it picks up the theme variables for free, and its labels are real text
   at a real size instead of glyphs that grow with the viewBox. Only the donut
   and the projection line are SVG, because HTML cannot draw an arc or a
   polyline. Neither of those two carries any text.

   Every function takes numbers and returns markup, so a view can call one in
   the middle of a template string. All the motion is in CSS. That way the
   prefers-reduced-motion rule at the bottom of the stylesheet kills the lot in
   one place, and every chart already sits at its finished state before the
   keyframes touch it.
   ============================================================ */

function chNum(n){n=Number(n);return isFinite(n)?Math.round(n*100)/100:0;}
function chPct(v,max){return max>0?Math.max(0,Math.min(100,v/max*100)):0;}
function chEmpty(msg){return '<div class="cempty">'+E(msg)+'</div>';}
/* Six accent classes on a loop. Sections will outrun them eventually and that
   is fine. What matters is that touching slices differ, not distant ones. */
function chTone(i){return 'ct'+(i%6+1);}

/* ---------------- columns ----------------
   spec.max     what one full height bar is worth
   spec.cols[]  {label, sub, subCls, bars:[{v, base, cls, tip}]}
   Give a bar a base and it floats that far off the floor, which is the whole
   trick behind a waterfall. Bars in one column split the width evenly.

   Bar width comes from the column count. Fix the inset and a three column
   chart draws slabs on a monitor while an eight column one draws threads.

   spec.connect adds the line a waterfall needs. Without it you see six
   floating rectangles. With it you see one balance getting cut down. The line
   sits at the top of each bar and runs back into the gutter so it lands where
   the bar before it finished. */
function chartCols(spec){
  var cols=spec.cols||[]; if(!cols.length) return chEmpty(spec.empty||'Nothing to draw yet.');
  var max=spec.max||0, h=spec.h||150, k=0;
  var n0=cols.length;
  var pad=n0<=2?26:n0<=3?20:n0<=4?15:n0<=6?9:n0<=9?5:3;
  var body=cols.map(function(c,ci){
    var bars=c.bars||[], n=bars.length;
    var gutter=n>1?2:0;
    var inner=bars.map(function(b,bi){
      var w=(100-pad*2)/n;
      var l=pad+w*bi+(bi?gutter:0), r=100-(pad+w*(bi+1))+(bi<n-1?gutter:0);
      var hp=chPct(Math.abs(b.v),max), bp=chPct(b.base||0,max);
      k++;
      return '<i class="cb '+(b.cls||'ct1')+'" style="--l:'+chNum(l)+'%;--r:'+chNum(r)+'%;'+
        '--h:'+chNum(Math.max(hp,hp>0?0.8:0))+'%;--b:'+chNum(bp)+'%;--d:'+(k*0.045).toFixed(3)+'s"'+
        (b.tip?' title="'+E(b.tip)+'"':'')+'></i>';
    }).join('');
    /* The connector belongs to the column it leads into, so the first one has
       nothing to join and is skipped. */
    var conn='';
    if(spec.connect&&ci>0&&bars.length){
      var top=chPct(Math.abs(bars[0].v)+(bars[0].base||0),max);
      conn='<u class="cconn" style="--y:'+chNum(top)+'%;--r:'+chNum(100-pad)+'%;--d:'+
        (ci*0.045+0.1).toFixed(3)+'s"></u>';
    }
    return '<div class="ccol">'+
      '<div class="cstack" style="--ch:'+h+'px">'+conn+inner+'</div>'+
      '<div class="clab">'+E(c.label)+'</div>'+
      (c.sub?'<div class="csub '+(c.subCls||'')+'">'+E(c.sub)+'</div>':'')+
      '</div>';
  }).join('');
  return '<div class="cchart'+(spec.connect?' wf':'')+'">'+body+'</div>';
}

/* ---------------- donut ----------------
   One circle per slice. The dash is as long as that slice's share and the
   offset is everything ahead of it. pathLength="100" turns the circumference
   into percent, so the radius never enters the maths. */
function chartDonut(slices,top,bottom){
  var live=(slices||[]).filter(function(s){return s.v>0;});
  var tot=live.reduce(function(a,s){return a+s.v;},0);
  if(!tot) return chEmpty('Nothing counted right now.');
  var acc=0;
  var arcs=live.map(function(s,i){
    var len=s.v/tot*100, off=-acc; acc+=len;
    return '<circle class="cdseg '+(s.cls||chTone(i))+'" cx="60" cy="60" r="47" pathLength="100" '+
      'style="--len:'+chNum(len)+';--d:'+(i*0.07).toFixed(2)+'s;stroke-dashoffset:'+chNum(off)+'">'+
      (s.label?'<title>'+E(s.label)+'</title>':'')+'</circle>';
  }).join('');
  return '<div class="cdonut"><svg viewBox="0 0 120 120" role="img" aria-label="Breakdown">'+
    '<circle class="cdtrack" cx="60" cy="60" r="47"></circle>'+
    '<g transform="rotate(-90 60 60)">'+arcs+'</g></svg>'+
    '<div class="cdmid"><b>'+E(top)+'</b><span>'+E(bottom)+'</span></div></div>';
}

/* ---------------- projection line ----------------
   pts are plain numbers. If the series crosses zero it gets a zero line, since
   where it crosses is the thing you actually want to see. */
function chartLine(pts,opts){
  opts=opts||{};
  var v=(pts||[]).map(function(x){return Number(x)||0;});
  if(v.length<2) return chEmpty('Not enough to project yet.');
  var W=600,H=170,PL=10,PR=10,PT=12,PB=12;
  var mn=Math.min.apply(null,v), mx=Math.max.apply(null,v);
  if(opts.zero!==false){mn=Math.min(mn,0);mx=Math.max(mx,0);}
  if(mx===mn){mx=mn+1;}
  var pad=(mx-mn)*0.08; mn-=pad; mx+=pad;
  var X=function(i){return PL+(W-PL-PR)*(v.length<2?0:i/(v.length-1));};
  var Y=function(y){return PT+(H-PT-PB)*(1-(y-mn)/(mx-mn));};
  var d='',i;
  for(i=0;i<v.length;i++){d+=(i?' L':'M')+chNum(X(i))+' '+chNum(Y(v[i]));}
  var area=d+' L'+chNum(X(v.length-1))+' '+chNum(Y(Math.max(mn,0)))+
           ' L'+chNum(X(0))+' '+chNum(Y(Math.max(mn,0)))+' Z';
  var zero=(mn<0&&mx>0)?'<line class="czero" x1="'+PL+'" x2="'+(W-PR)+'" y1="'+chNum(Y(0))+
    '" y2="'+chNum(Y(0))+'"></line>':'';
  var dots=v.map(function(y,j){
    return '<circle class="cdot" cx="'+chNum(X(j))+'" cy="'+chNum(Y(y))+'" r="3.4" '+
      'style="--d:'+(0.35+j*0.045).toFixed(3)+'s"></circle>';}).join('');
  return '<svg class="cline'+(opts.neg?' neg':'')+'" viewBox="0 0 '+W+' '+H+'" role="img" '+
    'aria-label="'+E(opts.label||'Projection')+'">'+
    '<defs><linearGradient id="cgFill" x1="0" y1="0" x2="0" y2="1">'+
    '<stop class="cgs0" offset="0"></stop><stop class="cgs1" offset="1"></stop>'+
    '</linearGradient></defs>'+
    zero+'<path class="carea" d="'+area+'"></path>'+
    '<path class="cpath" pathLength="1" d="'+d+'"></path>'+dots+'</svg>';
}

/* ---------------- legend rows ----------------
   On the money pages the switches live in the legend, so a row takes raw
   markup for its control instead of building one itself. */
function chartLegend(items){
  return '<div class="cleg">'+(items||[]).map(function(it){
    return '<div class="clrow'+(it.off?' off':'')+'">'+
      '<span class="cdotc '+(it.cls||'ct1')+'"></span>'+
      '<span class="cln">'+E(it.label)+'</span>'+
      '<b class="clv">'+E(it.value)+'</b>'+
      (it.pct!=null?'<span class="clp">'+E(it.pct)+'</span>':'')+
      (it.ctrl||'')+'</div>';}).join('')+'</div>';
}

/* ---------------- count up ----------------
   Big money figures roll up from zero when a page draws. The element is
   already holding its final text, so this borrows it and hands it back. Drop a
   frame, or turn motion off, and what is on screen is still the real number. */
function chReduced(){
  try{return !!(window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches);}
  catch(e){return false;}
}
function countUp(root){
  var els=$$('[data-cv]',root||document);
  if(!els.length||chReduced()||!window.requestAnimationFrame) return;
  var fin=els.map(function(el){return el.textContent;});
  var t0=null, DUR=680;
  function frame(ts){
    if(t0===null)t0=ts;
    var k=Math.min(1,(ts-t0)/DUR), e=1-Math.pow(1-k,3);
    for(var i=0;i<els.length;i++){
      if(k>=1){els[i].textContent=fin[i];continue;}
      var to=parseFloat(els[i].getAttribute('data-cv'));
      if(!isFinite(to)){els[i].textContent=fin[i];continue;}
      var f=els[i].getAttribute('data-cf')||'M', val=to*e;
      els[i].textContent = f==='pct' ? Math.round(val)+'%'
        : f==='n' ? N(val)
        : f==='h' ? (Math.round(val*10)/10)+'h'
        : M(val);
    }
    if(k<1) requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
}

/* ============================ session ============================ */
var ACCOUNT=null, HOUSE=null, CLIENT_ID='';

/* Where the API lives, worked out once. A bare relative 'api/...' resolves
   against whatever path the page happens to be on, so the app served from
   anywhere other than its own directory would start asking for /api/api/. */
var API_BASE=(function(){
  return location.pathname.replace(/[^\/]*$/,'')+'api/';
})();

function api(path,opts){
  opts=opts||{};
  var o={credentials:'same-origin',headers:{'X-LockedIn':'1'}};
  if(opts.body!==undefined){
    o.method='POST';
    o.headers['Content-Type']='application/json';
    o.body=JSON.stringify(opts.body);
  }
  return fetch(API_BASE+path,o).then(function(r){
    var ct=r.headers.get('content-type')||'';
    /* HTML back from an API call means the server handed us the app instead of
       running the PHP: either it is not uploaded, or the host is not executing
       it. Worth its own name, because "invalid response" sends you looking in
       entirely the wrong place. */
    if(ct.indexOf('json')<0){
      return r.text().then(function(t){
        var html=/^\s*<(!doctype|html)/i.test(t);
        return {ok:false,error:html?'no_api':'bad_response',__status:r.status};
      });
    }
    return r.json().catch(function(){return {ok:false,error:'bad_response'};})
      .then(function(j){ j.__status=r.status; return j; });
  }).catch(function(){
    return {ok:false,error:'offline',__status:0};
  });
}

/* Everything the app needs to know about who is looking at it. Called on boot
   and again after anything that could change the household. */
var API_TROUBLE='';
function loadSession(){
  return api('auth.php?do=me').then(function(r){
    API_TROUBLE = r.error==='no_api'
      ? 'The server sent back the app instead of running the API. Either api/ has not '+
        'been uploaded to this host, or this host is not running PHP.'
      : r.error==='not_configured'
      ? 'The server has no api/config.php yet. Copy api/config.sample.php to it and fill it in.'
      : '';
    CLIENT_ID=r.clientId||CLIENT_ID;
    ACCOUNT=r.signedIn?r.account:null;
    HOUSE=r.signedIn?r.household:null;
    return r;
  });
}

/* Google's script is loaded on demand rather than in the page head, so a
   signed in visitor never pays for it. */
function withGoogle(cb){
  if(window.google&&google.accounts&&google.accounts.id) return cb();
  var s=document.createElement('script');
  s.src='https://accounts.google.com/gsi/client';
  s.async=true; s.defer=true;
  s.onload=cb;
  s.onerror=function(){
    var e=document.getElementById('gerr');
    if(e){e.textContent='Could not reach Google. Check the connection and reload.';e.hidden=false;}
  };
  document.head.appendChild(s);
}

function mountGoogle(){
  var slot=document.getElementById('gbtn');
  if(!slot) return;
  if(!CLIENT_ID){
    slot.innerHTML='<p class="gerr">'+E(API_TROUBLE||
      'This copy has no Google client id set. Fill in google_client_id in api/config.php.')+
      '</p><p class="gnote"><a class="glink" href="'+E(API_BASE)+'check.php">Run the setup check</a></p>';
    return;
  }
  withGoogle(function(){
    google.accounts.id.initialize({
      client_id:CLIENT_ID,
      callback:onGoogleCredential,
      auto_select:false,
      cancel_on_tap_outside:true
    });
    google.accounts.id.renderButton(slot,{
      theme:(S.theme==='light'?'outline':'filled_black'),
      size:'large', shape:'pill', text:'continue_with', width:280
    });
    google.accounts.id.prompt();
  });
}

function onGoogleCredential(res){
  var slot=document.getElementById('gbtn');
  if(slot) slot.innerHTML='<div class="gwait">Signing in</div>';
  api('auth.php?do=google',{body:{credential:res.credential}}).then(function(r){
    if(!r.ok){
      /* Say which of the two it is. Google refusing the token and the server
         not being able to store the result need completely different fixes,
         and "try again" is the wrong advice for both. */
      var why={
        bad_token:'Google would not confirm that sign in. If this keeps happening, this '+
          'site is probably not listed under Authorized JavaScript origins on the OAuth client.',
        email_in_use:'That email address is already on another account.',
        not_configured:'This server has no api/config.php yet.',
        db_not_ready:'Signed in with Google, but the database is not ready. Open '+
          '/api/check.php and it will say which part.',
        db_unavailable:'Signed in with Google, but the server cannot reach its database. '+
          'Open /api/check.php and it will say which part.',
        server_error:'Something broke on the server. Open /api/check.php and it will say what.',
        bad_response:'The server replied with something that was not an answer. Open '+
          '/api/check.php and it will say what.',
        bad_origin:'The browser blocked that request. Reload the page and try again.',
        no_api:'The server sent back the app instead of running the API. Either api/ has '+
          'not been uploaded to this host, or this host is not running PHP.',
        offline:'Could not reach the server at all. Check the connection and try again.'
      }[r.error]||('Sign in failed ('+(r.error||('HTTP '+r.__status))+'). Open /api/check.php.');
      signInScreen(why);
      return;
    }
    /* A code typed on the join screen before signing in is applied now. */
    var pending=sessionStorage.getItem('li_invite')||'';
    var next=pending
      ? api('household.php?do=join',{body:{code:pending}}).then(function(){
          sessionStorage.removeItem('li_invite');})
      : Promise.resolve();
    next.then(boot);
  });
}

/* ============================ boot ============================ */
/* Order matters. Find out who is signed in, pull their state down, then draw.
   Drawing first and filling in later means the first paint is somebody else's
   data, or nobody's. */
function boot(){
  return loadSession().then(function(r){
    if(!r.signedIn){ signInScreen(); return; }
    return pullState().then(function(){
      var g=document.getElementById('gate');
      if(g&&g.parentNode) g.parentNode.removeChild(g);
      var app=document.getElementById('app');
      app.hidden=false;
      document.body.classList.add('unlocked');
      applyTheme();
      chrome();
      if(!ACCOUNT.onboarded||!MEMS().length){ startOnboarding(); return; }
      route();
      syncStart();
    });
  });
}

/* ============================ state sync ============================ */
/* Shared across the household. `days` is absent on purpose, it merges one date
   at a time below because the calendar is what two people touch at once. */
var BRANCHES=['members','household','ingOv','fav','lists','mine','photos','shop','fin','plan',
              'sched','exLog','prefs','onboarded'];
/* Never leaves this device. Which member is selected and whether it is dark are
   properties of the phone in your hand, not of the plan. */
var LOCAL_ONLY=['who','theme','__v','__t','__td'];
/* Lives in the private document, so nobody else in the household ever receives
   it. This is what makes hiding a surprise actually hidden. */
var PRIVATE=['secret'];

var docVer=0, privVer=0;
var syncState='off', syncAt=null, syncMsg='', syncTimer=null;
var syncPending=false, syncBusy=false, syncFails=0;
var _snap={}, _snapDays={};

function syncSet(st,msg){
  syncState=st; syncMsg=msg||'';
  var e=document.getElementById('syncPill');
  if(e) e.outerHTML=syncPill();
}
function syncPill(){
  var label={off:'Offline',idle:'Saved',pull:'Checking',push:'Saving',
    offline:'Offline',error:'Not saving'}[syncState]||syncState;
  var cls={idle:'ok',push:'busy',pull:'busy',offline:'warn',error:'bad',off:'off'}[syncState]||'';
  var title=syncMsg||(syncAt?('Last saved '+new Date(syncAt).toLocaleTimeString()):'');
  return '<button class="syncpill '+cls+'" id="syncPill" title="'+E(title)+'">'+
    '<i></i><span>'+E(label)+'</span></button>';
}

function stripLocal(o){
  var c={}; for(var k in o) if(LOCAL_ONLY.indexOf(k)<0&&PRIVATE.indexOf(k)<0) c[k]=o[k];
  return c;
}
function privatePart(){
  var c={}; PRIVATE.forEach(function(k){ if(S[k]!==undefined) c[k]=S[k]; });
  return c;
}

/* Stamp only what actually changed, so a phone that touched the shopping list
   does not claim to be the newer author of the budget as well. */
function syncTouch(){
  var nowT=Date.now(), first=!_snap.__init;
  S.__t=S.__t||{}; S.__td=S.__td||{};
  BRANCHES.forEach(function(b){
    var cur=JSON.stringify(S[b]===undefined?null:S[b]);
    if(first){ _snap[b]=cur; if(!S.__t[b]) S.__t[b]=nowT; return; }
    if(_snap[b]!==cur){ _snap[b]=cur; S.__t[b]=nowT; }
  });
  var days=S.days||{};
  Object.keys(days).forEach(function(d){
    var cur=JSON.stringify(days[d]);
    if(first){ _snapDays[d]=cur; if(!S.__td[d]) S.__td[d]=nowT; return; }
    if(_snapDays[d]!==cur){ _snapDays[d]=cur; S.__td[d]=nowT; }
  });
  _snap.__init=true;
  if(!first) queuePush();
}

/* Branch by branch, newest stamp wins. Days are merged one date at a time. */
function mergeIn(remote){
  if(!remote||typeof remote!=='object') return false;
  var rt=remote.__t||{}, rd=remote.__td||{}, changed=false;
  S.__t=S.__t||{}; S.__td=S.__td||{};
  BRANCHES.forEach(function(b){
    if(!(b in remote)) return;
    if((rt[b]||0)>(S.__t[b]||0)){ S[b]=remote[b]; S.__t[b]=rt[b]; changed=true; }
  });
  var rdays=remote.days||{};
  S.days=S.days||{};
  Object.keys(rdays).forEach(function(d){
    if((rd[d]||0)>(S.__td[d]||0)){ S.days[d]=rdays[d]; S.__td[d]=rd[d]; changed=true; }
  });
  return changed;
}

function pullState(){
  syncSet('pull');
  return api('doc.php?do=all').then(function(r){
    if(!r.ok){
      syncSet(r.__status===401?'off':'error', r.error||'');
      return;
    }
    docVer=r.shared.version||0;
    privVer=r.private.version||0;
    var changed=false;
    if(r.shared.body) changed=mergeIn(r.shared.body)||changed;
    if(r.private.body){ PRIVATE.forEach(function(k){
      if(r.private.body[k]!==undefined) S[k]=r.private.body[k]; }); }
    syncAt=Date.now();
    syncSet('idle');
    /* Take a snapshot without stamping, otherwise arriving data looks like a
       local edit and gets pushed straight back. */
    _snap={}; _snapDays={}; syncTouch();
    if(changed) try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}
  }).catch(function(){ syncSet('offline'); });
}

function queuePush(){
  if(syncState==='off') return;
  syncPending=true;
  if(syncTimer) clearTimeout(syncTimer);
  syncTimer=setTimeout(pushState,1200);
}

function pushState(){
  if(syncBusy||!syncPending||syncState==='off') return;
  syncBusy=true; syncPending=false;
  syncSet('push');
  var payload=stripLocal(S);
  payload.days=S.days; payload.__t=S.__t; payload.__td=S.__td;
  api('doc.php?scope=shared',{body:{version:docVer,body:payload}}).then(function(r){
    if(r.ok){
      docVer=r.version; syncAt=Date.now(); syncFails=0; syncSet('idle');
      return pushPrivate();
    }
    if(r.__status===409){
      /* Somebody else wrote while we were typing. Merge theirs in, take their
         version, and try once more on the next tick. */
      docVer=r.version||docVer;
      if(mergeIn(r.body)){ try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){} }
      syncPending=true; syncSet('idle');
      setTimeout(function(){ syncBusy=false; pushState(); },400);
      return 'retry';
    }
    if(r.__status===401){ syncSet('off','Signed out'); return; }
    syncFails++;
    syncSet(syncFails>2?'error':'offline', r.error||'');
  }).catch(function(){
    syncFails++; syncSet('offline');
  }).then(function(res){
    if(res!=='retry') syncBusy=false;
  });
}

function pushPrivate(){
  var mine=privatePart();
  if(!Object.keys(mine).length) return;
  return api('doc.php?scope=private:'+(ACCOUNT?ACCOUNT.id:0),
             {body:{version:privVer,body:mine}}).then(function(r){
    if(r.ok) privVer=r.version;
    else if(r.__status===409) privVer=r.version||privVer;
  });
}

function syncStart(){
  syncSet('idle');
  window.addEventListener('focus',function(){ if(!syncBusy) pullState(); });
  window.addEventListener('online',function(){ pullState(); });
  setInterval(function(){ if(!syncBusy&&!syncPending) pullState(); },90000);
  /* A tab closing mid-edit should still land. */
  window.addEventListener('pagehide',function(){
    if(syncPending&&!syncBusy){ if(syncTimer) clearTimeout(syncTimer); pushState(); }
  });
}

var DIET_Q=[

];

   rather than labels. */
var GOAL_Q=[

/* ============================ using the answers ============================ */

/* Hard filters first, then a score. A recipe that breaks a diet is gone, not
   ranked last, because ranking it last still shows it on a short list. */
function dietOK(r,diet){
  var df=r.df||[];
  for(var i=0;i<diet.length;i++) if(df.indexOf(diet[i])<0) return false;
  return true;
}
function goalScore(r,goals){
  var tg=r.tg||[], sc=0;
  goals.forEach(function(g){
    if(g==='cheap'){ sc+=Math.max(0,3-cps(r)); return; }
    var def=GOAL_Q.filter(function(x){return x[0]===g;})[0];
    if(!def) return;
    def[3].forEach(function(t){ if(tg.indexOf(t)>=0) sc+=2; });
  });
  return sc;
}
function recipesFor(diet,goals){
  var out=R.filter(function(r){return dietOK(r,diet||[]);});
  var g=goals||[];
  if(g.length) out.sort(function(x,y){return goalScore(y,g)-goalScore(x,g);});
  return out;
}
/* A starting book rather than the whole database, spread across the meal
   categories so the first thing somebody sees is a usable day of food. */
function startingFavourites(n){
  var pr=S.prefs||{};
  var byCat={}, out=[];
  recipesFor(pr.diet,pr.goals).forEach(function(r){
    (byCat[r.cat]=byCat[r.cat]||[]).push(r);
  });
  var cats=Object.keys(byCat), i=0;
  while(out.length<n){
    var added=false;
    for(var c=0;c<cats.length;c++){
      var list=byCat[cats[c]];
      if(i<list.length){ out.push(list[i].id); added=true; if(out.length>=n) break; }
    }
    if(!added) break;
    i++;
  }
  return out;
}

/* ============================ meal plans ============================
   Fill a run of days against somebody's calorie target. Greedy rather than
   clever: take the categories in the order people actually eat them, pick the
   recipe that gets the day closest to target without going over by much, and
   never repeat anything inside the window. Good enough that the plan is worth
   editing, which is the point. A plan you cannot argue with is a plan you
   cannot use. */
function makeMealPlan(opts){
  opts=opts||{};
  var who=opts.who||ME();
  var days=opts.days||7;
  var start=opts.start||today();
  var pr=S.prefs||{};
  var pool=recipesFor(pr.diet,pr.goals);
  if(opts.favOnly&&S.fav.length){
    var favSet={}; S.fav.forEach(function(id){favSet[id]=1;});
    var narrowed=pool.filter(function(r){return favSet[r.id];});
    if(narrowed.length>=8) pool=narrowed;
  }
  if(!pool.length) return null;

  var byCat={};
  pool.forEach(function(r){ (byCat[r.cat]=byCat[r.cat]||[]).push(r); });
  var order=['Breakfast','Lunch/Dinner','Lunch/Dinner','Snack'];

  var used={}, plan=[];
  var d0=dOf(start);
  for(var d=0;d<days;d++){
    var dt=new Date(d0.getFullYear(),d0.getMonth(),d0.getDate()+d);
    var ds=dt.getFullYear()+'-'+p2(dt.getMonth()+1)+'-'+p2(dt.getDate());
    var wk=(S.days[ds]||{}).workout||'rest';
    var tgt=dayTarget(who,wk);
    var got={kcal:0,p:0}, meals=[];
    order.forEach(function(cat,slot){
      var list=byCat[cat]||byCat['Lunch/Dinner']||pool;
      var left=order.length-slot;
      var want=(tgt.kcal-got.kcal)/Math.max(1,left);
      var best=null,bestScore=1e9;
      for(var i=0;i<list.length;i++){
        var r=list[i];
        if(used[r.id]) continue;
        /* Distance from the share of the day this slot should carry, with a
           nudge towards hitting protein, which is the target people actually
           miss. */
        var miss=Math.abs(r.k-want);
        var pGap=Math.max(0,(tgt.p-got.p)/Math.max(1,left)-r.p);
        var score=miss+pGap*12;
        if(score<bestScore){ bestScore=score; best=r; }
      }
      if(!best) return;
      used[best.id]=1;
      got.kcal+=best.k; got.p+=best.p;
      meals.push({id:best.id,q:1,who:who,at:defMealTime(slot)});
    });
    /* Let the pool come back round rather than running dry on day four. */
    if(Object.keys(used).length>pool.length-8) used={};
    plan.push({date:ds,meals:meals,kcal:Math.round(got.kcal),p:Math.round(got.p),
               target:tgt.kcal,protein:tgt.p});
  }
  return plan;
}

function applyMealPlan(plan,replace){
  if(!plan) return 0;
  var n=0;
  plan.forEach(function(day){
    var d=dayLog(day.date);
    if(replace) d.meals=[];
    day.meals.forEach(function(m){ d.meals.push(m); n++; });
  });
  save();
  return n;
}

/* ============================ the meal plan screen ============================
   Generate, look at it, change your mind, then put it on the calendar. The
   plan is never written anywhere until somebody presses the button, because a
   plan that applies itself is a plan you have to undo. */
var lastPlan=null, planDays=7, planWho=null, planFav=false;

function planTotals(p){
  var k=0,pr=0,c=0;
  p.forEach(function(d){k+=d.kcal;pr+=d.p;c+=d.target;});
  return {kcal:Math.round(k/p.length),p:Math.round(pr/p.length),target:Math.round(c/p.length)};
}

  var who=planWho||ME();

   '<p>Built from the '+pool+' recipes that fit how you eat, against '+E(WHO(who))+'&#39;s '+

   '<div class="row toolbar">'+

     ' &middot; '+N(d.p)+'g protein</span></div>'+

     '<th class="num">Protein</th><th></th></tr></thead><tbody>'+
     d.meals.map(function(m,j){var r=byId(m.id);if(!r)return '';

function bindMealPlan(){
  on('#mpWho','change',function(){planWho=this.value;});
  on('#mpDays','change',function(){planDays=+this.value;});
  on('#mpFav','click',function(){planFav=!planFav;route();});
  function gen(){
    lastPlan=makeMealPlan({who:planWho||ME(),days:planDays,favOnly:planFav});
    if(!lastPlan) toast('Nothing matches those diet filters yet');
    route();
  }
  on('#mpGo','click',gen);
  on('#mpGo2','click',gen);
  on('#mpApply','click',function(){
    var n=applyMealPlan(lastPlan,false);
    toast(n+' meals added'); location.hash='#/schedule';
  });
  on('#mpReplace','click',function(){
    if(!confirm('Replace everything already logged on those days?'))return;
    var n=applyMealPlan(lastPlan,true);
    toast(n+' meals set'); location.hash='#/schedule';
  });
  countUp($('#view'));
}

/* Swap one meal for the next best thing in the same category that is not
   already somewhere in the plan. */
function swapPlanMeal(di,mi){
  var day=lastPlan[di]; if(!day) return;
  var cur=byId(day.meals[mi].id); if(!cur) return;
  var inPlan={};
  lastPlan.forEach(function(d){d.meals.forEach(function(m){inPlan[m.id]=1;});});
  var pr=S.prefs||{};
  var cand=recipesFor(pr.diet,pr.goals).filter(function(r){
    return r.cat===cur.cat&&!inPlan[r.id];});
  if(!cand.length){toast('Nothing else in that category fits');return;}
  cand.sort(function(a,b){return Math.abs(a.k-cur.k)-Math.abs(b.k-cur.k);});
  day.meals[mi].id=cand[0].id;
  day.kcal=day.meals.reduce(function(a,m){var r=byId(m.id);return a+(r?r.k:0);},0);
  day.p=day.meals.reduce(function(a,m){var r=byId(m.id);return a+(r?r.p:0);},0);
  route();
}

function bindHousehold(){
  drawInvites();
  on('#hAddSeat','click',function(){
    var n=prompt('Who is it? You can invite them to their own login later.');
    if(!n) return;
    api('household.php?do=addSeat',{body:{name:n}}).then(function(r){
      if(!r.ok){toast(r.error==='no_seats'?'Every seat on this plan is taken':'Could not add');return;}
      /* Give them a member row too, so they show up on the plans right away. */
      if(!MEMS().some(function(m){return m.name===n;})){
        S.members.push(blankMember(n,'f')); save(); chrome();
      }
      refreshHouse().then(route);
    });
  });
  on('#hInvite','click',function(){
    var n=prompt('Who is this code for? (their name, so their seat is waiting)')||'';
    api('household.php?do=invite',{body:{name:n}}).then(function(r){
      if(!r.ok){toast(r.error==='no_seats'?'Every seat on this plan is taken':'Could not make a code');return;}
      modal('Their invite code',
        '<p>Send them this. It works once and lasts two weeks.</p>'+
        '<div class="invbig">'+E(r.code)+'</div>'+
        '<p class="sm muted">They open LockedIn, tap <b>I have an invite code</b>, type it, '+
        'and sign in with Google. Everything here is shared the moment they land.</p>',
        '<button class="b" data-close>Done</button>');
      drawInvites();
    });
  });
  on('#hLeave','click',function(){
    if(!confirm('Leave '+HOUSE.name+'? The shared plan stays with them. You start fresh on your own.'))return;
    api('household.php?do=leave',{body:{}}).then(function(r){
      if(!r.ok){toast(r.error==='owner_must_hand_over'?'Hand the household over first':'Could not leave');return;}

}

       'stroke-dasharray="'+L.toFixed(2)+' '+(C-L).toFixed(2)+'" stroke-dashoffset="'+off.toFixed(2)+'"/>';
    off-=L;});

    '<circle cx="18" cy="18" r="15.9155" fill="rgba(255,255,255,.14)" stroke="rgba(255,255,255,.22)" stroke-width="4.4"/>'+

     'looks full rather than flat, which is a fast and real visual change.</p><p><b>How much.</b> '+
     'Whatever is left: (calories - protein x 4 - fat x 9) / 4 = <b>'+c.c+' g</b>.</p>'+
     '<p>Storage capacity is roughly 15 g per kg bodyweight, about 1,000 g, worth 4,000 calories and '+
     '3 kg of water. Refilling it is most of what the first two weeks of eating properly shows on the scale.</p>')+
   D('Fat','<p>Hormones, cell membranes, and absorbing vitamins A, D, E and K.</p>'+

     'calories without volume, at 9 kcal per gram against 4 for the others.</p>')+
   D('Fiber and water','<p>Fiber target is 14 g per 1,000 kcal, so <b>'+c.fib+' g</b>. Raising it fast '+
     'is unpleasant, so add about 5 g a week.</p><p>Water is 0.6 oz per lb plus training and altitude, '+
     'about <b>'+c.w+' oz</b>. Colorado is dry enough that thirst lags behind actual need.</p>')+
   D('Leucine','<p>The amino acid that flips the switch on muscle protein synthesis. Roughly 2.5 to 3 g '+
     'per feeding saturates the signal.</p><p>It is ignition, not fuel. Hitting leucine without adequate '+

   D('How the calorie target is worked out','<p><b>1. RMR.</b> Mifflin-St Jeor: (10 x kg) + (6.25 x cm) '+

   D('Why the scale is not the whole story','<p>Daily swings of 2 to 4 lb are sodium, carb loading, '+

function avgCost(){var A=all();return A.reduce(function(a,r){return a+cps(r);},0)/A.length;}
function rank(left,tr){
  var t=TRAIN[tr]||TRAIN.rest;
  return all().map(function(r){var s=0;
    s-=Math.abs(r.k-left.k)/26; s+=Math.min(r.p,left.p*1.4)*1.9*t.p;
    s+=Math.min(r.c,140)*0.15*t.c; s+=(r.leu||0)*7;
    if(S.fav.indexOf(r.id)>=0)s+=14; return {r:r,s:s};})
    .sort(function(a,b){return b.s-a.s;}).map(function(o){return o.r;});
}
function applyFilters(){
  var g=$('#fgrid'); if(!g)return; var q=flt.q.toLowerCase();
  var L=all().filter(function(r){
    if(flt.cat&&r.cat!==flt.cat)return false;
    if(flt.tag&&r.tg.indexOf(flt.tag)<0)return false;
    if(q){var h=(r.n+' '+r.cat+' '+r.tg.join(' ')+' '+(r.ing||[]).map(function(i){
      var m=ING(i[1]);return m?m.n:'';}).join(' ')).toLowerCase();
      if(h.indexOf(q)<0)return false;}
    return true;});
  L.sort(function(a,b){var s=flt.sort;
    if(s==='cheap')return cps(a)-cps(b); if(s==='t')return a.t-b.t;
    if(s==='k')return b.k-a.k; if(s==='az')return a.n.localeCompare(b.n); return b.p-a.p;});
  g.innerHTML=L.length?L.map(rcard).join(''):'<p class="empty">Nothing matches.</p>';
  $('#fcount').textContent=L.length+' shown';
}

function drawIng(r,mult){
  var el=$('#ingList'); if(!el)return;
  el.innerHTML=(r.ing||[]).map(function(i){
    var meas=i[0],key=i[1],g=i[2]||0,q=ING(key);
    var nm=q?q.n:meas, pr=q?(g*mult/100)*best(q):0;
    var gs=g?Math.round(g*mult)+' g':'';
    var sub=(q&&meas)?' <span class="muted xs">('+E(meas)+')</span>':'';
    return '<li><b>'+gs+'</b><span>'+E(nm)+sub+'</span>'+
      (pr?'<span class="c">'+$$$(pr)+'</span>':'')+'</li>';}).join('');
  var sv=(r.sv||1)*mult, nice=function(x){return Math.round(x*10)/10;};
  var t=ctot(r)*mult;
  set('#svLabel','for '+nice(sv)+' serving'+(sv===1?'':'s'));
  set('#svHero',nice(sv)); set('#totHero',$$$(t)); set('#batchSv',nice(sv));
  var a=$('#batchAll'); if(a)a.innerHTML=Math.round(r.k*sv)+' kcal, '+Math.round(r.p*sv)+
    ' g protein, '+Math.round(r.c*sv)+' g carbs, '+Math.round(r.f*sv)+' g fat, '+$$$(t);
}

    '<button class="b o" data-x>Cancel</button><button class="b" id="ieSave">Save</button>');
