<script>
/* Stamp the theme before first paint so a dark-mode reload never flashes white.
   Kept deliberately tiny and inline; app.js owns the toggle from here on. */
(function(){
  try{
    var raw = localStorage.getItem('handbook.v6');
    var pref = raw ? (JSON.parse(raw).theme || 'auto') : 'auto';
    var dark = pref === 'dark' ||
      (pref === 'auto' && window.matchMedia &&
       window.matchMedia('(prefers-color-scheme: dark)').matches);
    if(dark) document.documentElement.setAttribute('data-theme','dark');
  }catch(e){}
})();
</script>

<script>
if('serviceWorker' in navigator){
  window.addEventListener('load',function(){
    navigator.serviceWorker.register('/sw.js').then(function(reg){
      // A new build is live: tell the app so it can offer a reload rather than
      // silently serving yesterday's bundle until every tab is closed.
      reg.addEventListener('updatefound',function(){
        var w=reg.installing; if(!w)return;
        w.addEventListener('statechange',function(){
          if(w.state==='installed' && navigator.serviceWorker.controller){
            window.Handbook && window.Handbook.updateReady(function(){
              w.postMessage({type:'SKIP_WAITING'});
            });
          }
        });
      });
    }).catch(function(){});
    var reloading=false;
    navigator.serviceWorker.addEventListener('controllerchange',function(){
      if(reloading)return; reloading=true; location.reload();
    });
  });
}
</script>
