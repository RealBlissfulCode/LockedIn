/* ============================ FINANCIAL ============================
   Every income line and every cost line carries an `off` flag. Off does not
   mean deleted. The row stays put, keeps its numbers, and stops counting. So
   "what if we dropped the gym and her tuition came out" is two switches and a
   redraw, and putting it back costs nothing. A line with no flag on it counts
   as on, which is what keeps older scenarios reading the way they always did.

   Everything that totals money goes through finIncome and finCost. One place
   honours the flag, so the charts cannot drift away from the tables. */
function finLive(x){return !x.off;}
function costInPath(c,path){
  if(c.section==='Housing (rent)') return path!=='buy';
  if(c.section==='Housing (buy)') return path==='buy';
  return true;
}
/* Pass all=true and the switched off lines count as well. That is how the
   page tells you what you have parked without putting it back. */
function finIncome(who,mode,all){
  return S.fin.jobs.filter(function(j){
    if(!all&&!finLive(j)) return false;
    return who==='both'||j.who===who||j.who===EVERYONE;})
    .reduce(function(a,j){return a+(j[mode]||0);},0);
}
function finCost(mode,path,all){
  return S.fin.costs.filter(function(c){
    if(!all&&!finLive(c)) return false;
    return costInPath(c,path);}).reduce(function(a,c){return a+(c[mode]||0);},0);
}
/* Totals for a saved snapshot, which has its own jobs, costs, mode and path. */
function scenTotals(sc){
  var si=(sc.jobs||[]).filter(finLive).reduce(function(a,j){return a+(j[sc.mode]||0);},0);
  var sc_=(sc.costs||[]).filter(function(c){return finLive(c)&&costInPath(c,sc.path);})
    .reduce(function(a,c){return a+(c[sc.mode]||0);},0);
  return {inc:si,cost:sc_,gap:si-sc_};
}
function shiftsFor(who,from){
  return S.fin.shifts.filter(function(s){
    var j=S.fin.jobs.filter(function(x){return x.id===s.jobId;})[0];
    if(who&&j&&j.who!==who&&j.who!==EVERYONE)return false;
    if(from&&s.date<from)return false; return true;});
}
/* What actually lands per dollar earned, measured off real shifts instead of
   guessed at. Only falls back to 80% when there is nothing logged yet. */
function takeHomeRate(){
  var g=0,n=0;
  S.fin.shifts.forEach(function(s){g+=(s.gross||0);n+=(s.net||0);});
  return (g>0&&n>0)?n/g:0.8;
}
function bestLiveRate(){
  var r=0;
  S.fin.jobs.forEach(function(j){if(finLive(j)&&j.rate>r)r=j.rate;});
  return r;
}
var FINMODES=[['low','Lean'],['real','Realistic'],['high','Good month'],['actual','Actual']];
function modeLabel(m){
  for(var i=0;i<FINMODES.length;i++) if(FINMODES[i][0]===m) return FINMODES[i][1];
  return m;
}
/* The switch. Same markup for a line, a section and a person, so all three
   behave alike and one CSS rule covers them. */
function finSw(attr,val,on,label,small){
  return '<button type="button" class="sw'+(small?' xs':'')+(on?' on':'')+'" '+
    'data-'+attr+'="'+E(val)+'" aria-pressed="'+(on?'true':'false')+'" '+
    'title="'+E((on?'Counted. Click to switch off: ':'Switched off. Click to count: ')+label)+'">'+
    '<i></i></button>';
}
function vFinancial(sub){
  if(sub==='purchases') return vPurchases();
  if(sub==='strategies') return vStrategies();
  if(sub==='actual') return vActual();
  var mode=S.fin.costMode||'real', path=S.fin.path||'rent';
  var inc=finIncome('both',mode), cost=finCost(mode,path), gap=inc-cost;

  /* ---- what is parked ---- */
  var offJobs=S.fin.jobs.filter(function(j){return !finLive(j);});
  var offCosts=S.fin.costs.filter(function(c){return !finLive(c)&&costInPath(c,path);});
  var offInc=finIncome('both',mode,true)-inc;
  var offCost=finCost(mode,path,true)-cost;

  /* ---- costs by section, live and parked separately ---- */
  var byS={}, bySAll={};
  S.fin.costs.forEach(function(c){
    if(!costInPath(c,path)) return;
    bySAll[c.section]=(bySAll[c.section]||0)+(c[mode]||0);
    if(finLive(c)) byS[c.section]=(byS[c.section]||0)+(c[mode]||0);
    else if(!(c.section in byS)) byS[c.section]=0;
  });
  var secNames=Object.keys(byS).sort(function(a,b){return (bySAll[b]||0)-(bySAll[a]||0);});

  /* ---- derived numbers ---- */
  var saveRate=inc>0?gap/inc*100:0;
  var toSavings=byS['Savings']||0;               /* money into savings is not spent */
  var toDebt=byS['Debt']||0;
  var building=gap+toSavings;                    /* what the month actually adds */
  var burn=cost-toSavings;                       /* what leaving the house costs */
  var rate=bestLiveRate(), th=takeHomeRate();
  var hoursToClose=(gap<0&&rate>0)?(-gap)/(rate*th):0;
  var perDollar=inc>0?secNames.map(function(k){return [k,byS[k]/inc*100];}):[];

  /* ---- headline ---- */
  var stats='<div class="stats">'+
   '<div class="stat"><b data-cv="'+inc+'">'+M(inc)+'</b><span>Income / mo</span></div>'+
   '<div class="stat"><b data-cv="'+cost+'">'+M(cost)+'</b><span>Costs / mo</span></div>'+
   '<div class="stat '+(gap>=0?'good':'bad')+'"><b data-cv="'+gap+'">'+M(gap)+'</b><span>'+
   (gap>=0?'Surplus':'Shortfall')+'</span></div>'+
   '<div class="stat"><b data-cv="'+(gap*12)+'">'+M(gap*12)+'</b><span>Per year</span></div>'+
   '<div class="stat"><b data-cv="'+saveRate+'" data-cf="pct">'+Math.round(saveRate)+'%</b>'+
   '<span>Kept of income</span></div></div>';

  var verdict='';
  if(gap<0){
    verdict='<div class="note warn"><b>The gap is real.</b> At these numbers we are '+M(-gap)+
      ' short every month'+
      (hoursToClose>0?', which is <b>'+(Math.round(hoursToClose*10)/10)+' more hours a month</b> at '+
        $$$(rate)+'/hr once '+Math.round((1-th)*100)+'% comes off for tax':'')+
      '. Income has to rise by that, or costs have to fall.</div>';
  } else if(inc>0){
    verdict='<div class="note good"><b>'+M(gap)+' clear a month.</b> That is '+
      Math.round(saveRate)+'% of everything coming in, '+M(gap*12)+' over a year'+
      (toSavings>0?', on top of the '+M(toSavings)+' a month already going into savings as a cost line':'')+
      '.</div>';
  }

  var parked='';
  if(offJobs.length||offCosts.length){
    parked='<div class="note"><b>Switched off.</b> '+
      (offJobs.length?offJobs.length+' income line'+(offJobs.length>1?'s':'')+' worth '+M(offInc)+' / mo':'')+
      (offJobs.length&&offCosts.length?' and ':'')+
      (offCosts.length?offCosts.length+' cost line'+(offCosts.length>1?'s':'')+' worth '+M(offCost)+' / mo':'')+
      ' are sitting out of these totals. Switching every one back on would put the month at <b>'+
      M(gap+offInc-offCost)+'</b>.</div>';
  }

  /* ---- waterfall: income, then each section, then what is left ---- */
  /* Three colours doing three jobs: what arrives, what comes off, what
     survives. Giving every section its own colour made six deductions look
     like six unrelated things rather than one balance getting cut down. The
     donut underneath is where sections get their own identity. */
  var wfMax=Math.max(inc,cost,1), run=inc;
  var wfCols=[{label:'Income',sub:M(inc),subCls:'good',
    bars:[{v:inc,base:0,cls:'ctg',tip:'Everything coming in: '+M(inc)}]}];
  secNames.forEach(function(k,i){
    var v=byS[k]; if(v<=0) return;
    var base=Math.max(0,run-v);
    wfCols.push({label:k,sub:'−'+M(v),subCls:'bad',
      bars:[{v:v,base:base,cls:'ctb',
        tip:k+': '+M(v)+' off, leaving '+M(base)}]});
    run-=v;
  });
  wfCols.push({label:gap>=0?'Left over':'Short by',sub:M(Math.abs(gap)),subCls:gap>=0?'good':'bad',
    bars:[{v:Math.abs(gap),base:0,cls:gap>=0?'ctg':'ctb',
      tip:(gap>=0?'Left over: ':'Short by: ')+M(Math.abs(gap))}]});
  var waterfall='<div class="sec"><h2>From income to what is left</h2>'+
    '<p class="sub">The first bar is everything coming in. Each one after it is a live cost '+
    'section taken off the running balance, biggest first, on the '+modeLabel(mode).toLowerCase()+
    ' column while '+(path==='buy'?'buying':'renting')+'. The last bar is what survives.</p>'+
    '<div class="card pad">'+chartCols({max:wfMax,h:180,cols:wfCols,connect:true})+
    '<div class="ckey"><span><i class="ctg"></i>Money in, and what is left of it</span>'+
    '<span><i class="ctb"></i>Taken off the balance</span>'+
    '<span class="muted">Each bar starts where the one before it ended</span></div>'+
    '</div></div>';

  /* ---- donut of live costs, with a switch per section in the legend ---- */
  var donutSlices=secNames.map(function(k,i){return {v:byS[k],label:k+' '+M(byS[k]),cls:chTone(i)};});
  var legend=chartLegend(secNames.map(function(k,i){
    var anyOn=S.fin.costs.some(function(c){return costInPath(c,path)&&c.section===k&&finLive(c);});
    return {label:k,cls:chTone(i),off:!anyOn,
      value:M(anyOn?byS[k]:bySAll[k]),
      pct:(cost&&anyOn)?Math.round(byS[k]/cost*100)+'%':'-',
      ctrl:finSw('secttog',k,anyOn,k,true)};
  }));
  var incomePeople=whoTokens().filter(function(w){
    return S.fin.jobs.some(function(j){return j.who===w;});});
  var incLegend=chartLegend(incomePeople.map(function(w,i){
    var v=S.fin.jobs.filter(function(j){return j.who===w&&finLive(j);})
      .reduce(function(a,j){return a+(j[mode]||0);},0);
    var all=S.fin.jobs.filter(function(j){return j.who===w;})
      .reduce(function(a,j){return a+(j[mode]||0);},0);
    var anyOn=S.fin.jobs.some(function(j){return j.who===w&&finLive(j);});
    return {label:w===EVERYONE?'Shared / gig':WHO(w),cls:chTone(i+1),off:!anyOn,
      value:M(anyOn?v:all),pct:(inc&&anyOn)?Math.round(v/inc*100)+'%':'-',
      ctrl:finSw('whotog',w,anyOn,w===EVERYONE?'shared income':WHO(w),true)};
  }));
  var costPeople=whoTokens().filter(function(w){
    return S.fin.costs.some(function(c){return c.who===w&&costInPath(c,path);});});
  var whoCost='<div class="ckey">'+costPeople.map(function(w,i){
    var v=S.fin.costs.filter(function(c){return c.who===w&&finLive(c)&&costInPath(c,path);})
      .reduce(function(a,c){return a+(c[mode]||0);},0);
    return '<span><i class="'+chTone(i+3)+'"></i>'+E(w===EVERYONE?'Shared':WHO(w))+' '+M(v)+'</span>';
  }).join('')+'</div>';

  var split='<div class="sec"><h2>Where the money goes</h2>'+
   '<p class="sub">Every switch here moves a whole group at once. The tables further down do it one '+
   'line at a time.</p><div class="grid g2">'+
   '<div class="card pad"><h3 class="ctitle">Costs by section</h3>'+
   chartDonut(donutSlices,M(cost),'Live costs / mo')+legend+
   (perDollar.length?'<p class="sm muted" style="margin-top:14px">Of every $100 coming in, '+
     perDollar.slice(0,3).map(function(p){return '$'+Math.round(p[1])+' goes to '+E(p[0].toLowerCase());}).join(', ')+
     '.</p>':'')+'</div>'+
   '<div class="card pad"><h3 class="ctitle">Income by person</h3>'+
   chartDonut(incomePeople.map(function(w,i){
     return {v:S.fin.jobs.filter(function(j){return j.who===w&&finLive(j);})
       .reduce(function(a,j){return a+(j[mode]||0);},0),
       label:(w===EVERYONE?'Shared':WHO(w)),cls:chTone(i+1)};}),M(inc),'Live income / mo')+
   incLegend+
   '<h3 class="ctitle" style="margin-top:20px">Costs carried by</h3>'+whoCost+
   '<div class="row" style="margin-top:14px"><button class="b o s" id="jobAdd">Add income</button>'+
   '<button class="b o s" id="costAdd2">Add cost</button></div></div>'+
   '</div></div>';

  /* ---- the same month read four ways ---- */
  /* The actual column only earns a place once both sides of it are filled in.
     Most cost lines carry a researched figure and hardly any income line does,
     so letting it in early draws a month with real rent and no wages on it. */
  var actReady=finIncome('both','actual')>0&&finCost('actual',path)>0;
  var bandModes=FINMODES.filter(function(m){return m[0]!=='actual'||actReady;});
  var bandVals=bandModes.map(function(m){
    var i2=finIncome('both',m[0]), c2=finCost(m[0],path);
    return {m:m[0],label:m[1],inc:i2,cost:c2,gap:i2-c2};});
  var bandMax=Math.max.apply(null,bandVals.map(function(b){return Math.max(b.inc,b.cost);}).concat([1]));
  var best=bandVals.slice().sort(function(a,b){return b.gap-a.gap;})[0];
  var worst=bandVals.slice().sort(function(a,b){return a.gap-b.gap;})[0];
  var band='<div class="sec"><h2>The same month, read '+
   (['','one way','two ways','three ways','four ways'][bandVals.length]||'every way')+'</h2>'+
   '<p class="sub">Identical lines, identical switches. Only the estimate column changes. '+
   'The spread between the ends is what the plan actually rests on.</p>'+
   '<div class="card pad">'+
   chartCols({max:bandMax,h:160,cols:bandVals.map(function(b){
     return {label:b.label,sub:M(b.gap),subCls:b.gap>=0?'good':'bad',
       bars:[{v:b.inc,cls:'ct2',tip:'Income '+M(b.inc)},{v:b.cost,cls:'ct5',tip:'Costs '+M(b.cost)}]};})})+
   '<div class="ckey"><span><i class="ct2"></i>Income</span><span><i class="ct5"></i>Costs</span>'+
   '<span class="muted">Number under each column is that month\'s surplus</span></div>'+
   (bandVals.length>1?'<p class="sm muted" style="margin-top:12px">Best case '+
     M(best.gap)+' a month on '+E(best.label.toLowerCase())+', worst '+M(worst.gap)+' on '+
     E(worst.label.toLowerCase())+'. A '+M(best.gap-worst.gap)+' swing, '+
     M((best.gap-worst.gap)*12)+' over a year.'+
     (actReady?'':' The actual column is not drawn yet: it needs a researched figure on the '+
       'income side as well as the cost side.')+'</p>':'')+
   '</div></div>';

  /* ---- twelve months of the current month, repeated ---- */
  var proj=[],pv=0,pi;

   '<div class="stats" style="margin-top:16px">'+
   '<div class="stat '+(gap>=0?'good':'bad')+'"><b data-cv="'+(gap*3)+'">'+M(gap*3)+'</b><span>After 3 months</span></div>'+
   '<div class="stat '+(gap>=0?'good':'bad')+'"><b data-cv="'+(gap*6)+'">'+M(gap*6)+'</b><span>After 6 months</span></div>'+
   '<div class="stat '+(gap>=0?'good':'bad')+'"><b data-cv="'+(gap*12)+'">'+M(gap*12)+'</b><span>After a year</span></div>'+
   '<div class="stat"><b data-cv="'+building+'">'+M(building)+'</b><span>Built / mo</span></div>'+
   '<div class="stat"><b data-cv="'+burn+'">'+M(burn)+'</b><span>Spent / mo</span></div></div>'+
   '<p class="sm muted" style="margin-top:12px">Built counts the surplus plus the '+M(toSavings)+
   ' a month sitting in the Savings section, because money moved into savings was never spent. '+
   'Spent is everything else'+(toDebt>0?', including '+M(toDebt)+' a month servicing debt':'')+'.</p>'+
   '</div></div>':'';

  /* ---- saved scenarios ---- */
  var pairs=scenAllFixed(), names=pairs.map(function(p){return p[0];});
  var act=S.fin.activeScenario, dirty=scenDirty();
  var cmp='';
  if(names.length){
    var scRows=pairs.map(function(pr){var n=pr[0],sc=pr[1];
      if(!sc||!sc.jobs||!sc.costs) return null;

      var offN=(sc.jobs.filter(function(j){return !finLive(j);}).length)+
               (sc.costs.filter(function(c){return !finLive(c);}).length);

    var scMax=Math.max.apply(null,scRows.map(function(r){

      '<div class="card pad gap-b">'+chartCols({max:scMax,h:150,cols:
        [{label:'Now'+(act?' ('+act+')':''),sub:M(gap),subCls:gap>=0?'good':'bad',

      '<div class="ckey"><span><i class="ct2"></i>Income</span><span><i class="ct5"></i>Costs</span>'+
      '<span class="muted">Number under each column is the surplus</span></div></div>'+
      '<div class="tw"><table><thead><tr><th>Scenario</th><th>Basis</th><th>Housing</th>'+
      '<th class="num">Income</th><th class="num">Costs</th><th class="num">Monthly</th>'+
      '<th class="num">Yearly</th><th class="num">Off</th><th></th></tr></thead><tbody>'+
      scRows.map(function(r){
        return '<tr'+(r.n===act?' style="background:var(--panel-2)"':'')+'>'+

        '<td class="num">'+M(r.t.inc)+'</td><td class="num">'+M(r.t.cost)+'</td>'+
        '<td class="num" style="color:'+(r.t.gap>=0?'var(--sage)':'var(--clay)')+'"><b>'+M(r.t.gap)+'</b></td>'+
        '<td class="num">'+M(r.t.gap*12)+'</td>'+
        '<td class="num sm muted">'+(r.off||'-')+'</td>'+
        '<td><button class="b o s" data-scload="'+E(r.n)+'">Open</button> '+
        '<button class="x" data-scdel="'+E(r.n)+'">&times;</button></td></tr>';}).join('')+
      '</tbody></table></div></div>';
  }

  /* ---- the lines themselves ---- */
  var jobsOn=S.fin.jobs.filter(finLive).length;
  var costsOn=S.fin.costs.filter(function(c){return finLive(c)&&costInPath(c,path);}).length;
  var costsInPath=S.fin.costs.filter(function(c){return costInPath(c,path);}).length;

  var incTable='<div class="sec"><div class="spread"><h2>Income lines</h2>'+
   '<div class="row"><span class="chip p">'+jobsOn+' of '+S.fin.jobs.length+' on</span>'+

   '<button class="b o s" data-alltog="jobs|0">All off</button>'+
   '<button class="b o s" id="jobAdd2">Add</button></div></div><div class="tw wide"><table>'+

   '<th class="num">Realistic</th><th class="num">High</th><th class="num">Actual</th><th></th></tr></thead><tbody>'+
   (S.fin.jobs.length?S.fin.jobs.map(function(j){
     var on=finLive(j);
     return '<tr'+(on?'':' class="offrow"')+'>'+
     '<td>'+finSw('jobtog',j.id,on,j.name||'this income line')+'</td>'+
     '<td><span class="chip">'+E(WHO(j.who))+'</span></td><td><b>'+E(j.name)+'</b>'+
     (on?'':'<span class="offtag">off</span>')+

/* Six calendar months of shifts, oldest first, so the chart runs left to right
   the way a year does. A month with nothing in it stays as a zero instead of
   getting dropped. Drop it and the gaps close up, and a slow month ends up
   looking like it never happened. */
function shiftMonths(n){
  var out=[],d=new Date(),i;
  d.setDate(1);
  for(i=n-1;i>=0;i--){
    var m=new Date(d.getFullYear(),d.getMonth()-i,1);
    var key=m.getFullYear()+'-'+p2(m.getMonth()+1);
    out.push({key:key,label:m.toLocaleDateString(undefined,{month:'short'}),
      net:0,gross:0,hours:0});
  }
  S.fin.shifts.forEach(function(s){
    var k=String(s.date||'').slice(0,7);
    for(var j=0;j<out.length;j++) if(out[j].key===k){
      out[j].net+=(s.net||0); out[j].gross+=(s.gross||0); out[j].hours+=(s.hours||0);}
  });
  return out;
}
function vActual(){

  var sh=S.fin.shifts.slice().sort(function(a,b){return b.date<a.date?-1:1;});
  function tot(who,field){return shiftsFor(who,f).reduce(function(a,s){return a+(s[field]||0);},0);}
  /* One card per member instead of two fixed ones. Somebody with nothing
     logged still gets a card, because an empty card is how you notice. */
  var perMember=MEMS().map(function(m){
    return {id:m.id,name:m.name,
            hours:tot(m.id,'hours'),gross:tot(m.id,'gross'),net:tot(m.id,'net')};});

   /* Nothing logged means there is no comparison to make. Draw one anyway and

   (logged.length

/* ---------------------------- STRATEGIES ----------------------------
   Ways to close the gap, grouped into lists you own. Same rules as every
   other list in the app: make them, rename them, delete them. */
function stratClass(st){
  var s=String(st||'').toUpperCase();
  if(s==='DEAD'||s==='BLOCKED'||s==='N/A'||s==='NEGLIGIBLE') return 'd3';
  if(s==='CRITICAL'||s==='LOCKED'||s==='KEY') return 'd2';
  if(s==='ACTIVE'||s==='READY'||s==='ON TRACK'||s==='STAGED'||s==='DONE') return 'd1';
  return '';
}
function stratDead(st){
  var s=String(st||'').toUpperCase();
  return s==='DEAD'||s==='N/A'||s==='NEGLIGIBLE'||s==='BLOCKED';
}
function stratTotal(list,mode){
  return (list.items||[]).reduce(function(a,x){
    return a+(stratDead(x.status)?0:num(x[mode]));},0);
}

/* When is everybody free at once. Only worth drawing for a household of more
   than one, and only counting people who actually have something booked, since
   a member with an empty day is free by definition and would otherwise widen
   every window to the whole day. */
function freeSlots(d){
  if(!shared()) return '';
  var busy={};
  (d.sched||[]).forEach(function(e){
    if(!e.from||!e.to) return;
    var keys=(e.who===EVERYONE)?MEMS().map(function(m){return m.id;}):[e.who];
    keys.forEach(function(k){ (busy[k]=busy[k]||[]).push([e.from,e.to]); });
  });
  var booked=Object.keys(busy);
  if(!booked.length) return '';
  function mins(t){var p=String(t).split(':');return (+p[0])*60+(+(p[1]||0));}
  var free=[],start=8*60,end=22*60,step=30;
  for(var m=start;m<end;m+=step){
    var clash=false;
    booked.forEach(function(w){busy[w].forEach(function(b){
      if(m>=mins(b[0])&&m<mins(b[1]))clash=true;});});
    if(!clash)free.push(m);
  }
  if(!free.length) return '<div class="note" style="margin-top:12px">No overlapping free time today.</div>';
  var blocks=[],cur=[free[0],free[0]+step];
  for(var i=1;i<free.length;i++){ if(free[i]===cur[1])cur[1]=free[i]+step; else {blocks.push(cur);cur=[free[i],free[i]+step];} }
  blocks.push(cur);
  var fmt=t12m;
  var win=blocks.filter(function(b){return b[1]-b[0]>=60;});
  if(!win.length) return '';
  return '<div class="note" style="margin-top:12px"><b>Everyone free.</b> '+
    win.map(function(b){return fmt(b[0])+' to '+fmt(b[1]);}).join(', ')+'</div>';
}

/* route() does two jobs: it takes you somewhere, and it redraws where you
   already are. Nearly every edit in the app finishes with a route() call, so
   treating both the same is why flipping a switch, picking an estimate column
   or saving a modal threw you back to the top of a long page.

   The hash sorts them out. Same hash as the last draw is a redraw, so hold the
   scroll and skip the page slide. The only things that move are the numbers
   rolling and the bars regrowing. A different hash is real navigation and
   still lands at the top. */
var _lastHash=null;
function reroute(){route();}
function route(){
  var h=(location.hash||'#/meals').slice(2).split('/'), v=h[0]||'meals', sub=h[1]||'';
  var m=$('#view'); if(!m) return;
  var hash=location.hash||'#/meals';
  var redraw=(hash===_lastHash);
  var keepY=redraw?(window.pageYOffset||0):0;
  _lastHash=hash;
  var html;
  try{
    html = v==='r'?vRecipe(sub) : v==='training'?vTraining(sub) : v==='shopping'?vShopping(sub)
      : v==='financial'?vFinancial(sub) : v==='planning'?vPlanning(sub)
      : v==='lists'?vRecipeLists()
      : v==='household'?vHousehold()
      : v==='mealplan'?vMealPlan()
      : v==='schedule'?vSchedule(sub) : vMeals();
  }catch(e){ html=errPanel(v.charAt(0).toUpperCase()+v.slice(1),e);
    if(window.console&&console.error)console.error(e); }
  m.innerHTML=html;
  if(redraw){var _pg=m.querySelector('.page'); if(_pg)_pg.classList.add('noanim');}
  try{window.scrollTo(0,redraw?keepY:0);}catch(e){}
  try{
    $$('.tab,.btmnav button').forEach(function(b){
      b.classList.toggle('on', b.dataset.v===(v==='r'?'meals':v));});
    $$('#who button').forEach(function(b){b.classList.toggle('on', b.dataset.w===S.who);});
  }catch(e){}
  try{ bind(); }catch(e){ if(window.console&&console.error)console.error('bind',e); }
}

/* ---------------- switching lines in and out ----------------
   One writer behind every switch on the page. It never deletes anything and
   never touches a figure. It sets `off` and redraws. Since `off` is part of
   what a scenario snapshots, flipping one marks the open scenario dirty the
   same way editing a number does. That is right: the switches are part of the
   plan, not a setting on the view. */
function finToggle(kind,pred,to){
  var arr=kind==='jobs'?S.fin.jobs:S.fin.costs, n=0;
  arr.forEach(function(x){
    if(!pred(x)) return;
    var want=(to===null||to===undefined)?!x.off:!to;
    if(!!x.off===want) return;
    x.off=want; n++;});
  if(n){save();reroute();}
  return n;
}

/* Lists are keyed by their name, so renaming one means rebuilding the object.
   Done in place rather than delete-and-add so the list keeps its position. */
function renameKey(obj,from,to){
  if(from===to) return true;
  if(obj[to]) { toast('"'+to+'" already exists'); return false; }
  var out={};
  Object.keys(obj).forEach(function(k){ out[k===from?to:k]=obj[k]; });
  Object.keys(obj).forEach(function(k){ delete obj[k]; });
  Object.keys(out).forEach(function(k){ obj[k]=out[k]; });
  return true;
}

  if((el=t.closest('[data-hrevoke]'))){

  if((el=t.closest('[data-hover]'))){
    if(!confirm('Hand the household over? They become the owner and you become a member.'))return;

      refreshHouse().then(route);});
    return;}
  if((el=t.closest('[data-hdrop]'))){
    if(!confirm('Remove them? Their private notes go with them. Everything shared stays.'))return;

      refreshHouse().then(route);});
    return;}
  if((el=t.closest('[data-memdel]'))){
    var mid=el.dataset.memdel;
    if(MEMS().length<2){toast('A household needs at least one person');return;}
    if(!confirm('Remove '+WHO(mid)+'? Anything logged against them stays, tagged to nobody.'))return;
    S.members=MEMS().filter(function(x){return x.id!==mid;});
    if(S.who===mid) S.who=ME();
    save();chrome();route();return;}
  if((el=t.closest('[data-fav]'))){e.stopPropagation();
    var id=el.dataset.fav,i=S.fav.indexOf(id);
    if(i>=0)S.fav.splice(i,1);else S.fav.push(id); save();route();return;}
  if((el=t.closest('[data-go]'))){nav('r/'+el.dataset.go);return;}
  if((el=t.closest('[data-log]'))){var dt=dayLog(today());
    dt.meals.push({id:el.dataset.log,q:1,who:ME(),at:defMealTime(dt.meals.length)});
    save();toast('Logged to today for '+MENAME());return;}
  if((el=t.closest('[data-groc]'))){addRecipeToShop(byId(el.dataset.groc));
    toast('Added to '+S.shop.active);return;}
  if((el=t.closest('[data-tolist]'))){listModal(el.dataset.tolist);return;}
  if((el=t.closest('[data-rlrm]'))){var rr=el.dataset.rlrm.split('|');
    var arr=S.lists[rr[0]]||[]; var ri=arr.indexOf(rr[1]);
    if(ri>=0){arr.splice(ri,1);save();route();} return;}
  if((el=t.closest('[data-rle]'))){var on_=el.dataset.rle;
    var nn=prompt('Rename the list',on_); if(!nn||nn===on_)return;
    if(S.lists[nn]){toast('"'+nn+'" already exists');return;}
    if(!renameKey(S.lists,on_,nn))return; save();route();return;}
  if((el=t.closest('[data-rld]'))){
    if(confirm('Delete the list "'+el.dataset.rld+'"? The recipes themselves stay.')){
      delete S.lists[el.dataset.rld];save();route();} return;}
  if((el=t.closest('[data-rlgroc]'))){
    var added=0;
    (S.lists[el.dataset.rlgroc]||[]).map(byId).filter(Boolean).forEach(function(r){
      addRecipeToShop(r);added++;});
    toast(added?added+' recipe'+(added===1?'':'s')+' added to '+S.shop.active:'Nothing to add');
    return;}
  if((el=t.closest('[data-photo]'))){pickPhoto(el.dataset.photo);return;}
  if((el=t.closest('[data-card]'))){cardPNG(byId(el.dataset.card));return;}
  if((el=t.closest('[data-list]'))){S.shop.active=el.dataset.list;save();route();return;}
  if((el=t.closest('[data-gt]'))){var L=curList();
    L.items[+el.dataset.gt].done=el.checked;save();route();return;}
  if((el=t.closest('[data-gd]'))){curList().items.splice(+el.dataset.gd,1);save();route();return;}
  if((el=t.closest('[data-ge]'))){shopItemEditor(+el.dataset.ge);return;}
  if((el=t.closest('[data-ie]'))){ingEditor(el.dataset.ie);return;}
  if((el=t.closest('[data-sess]'))){sessModal(+el.dataset.sess);return;}
  if((el=t.closest('[data-jobe]'))){jobEditor(el.dataset.jobe);return;}
  if((el=t.closest('[data-coste]'))){costEditor(el.dataset.coste);return;}

  /* switches: one line, a whole cost section, one earner, or everything */
  if((el=t.closest('[data-jobtog]'))){var jid=el.dataset.jobtog;
    finToggle('jobs',function(x){return x.id===jid;},null);return;}
  if((el=t.closest('[data-costtog]'))){var cid=el.dataset.costtog;
    finToggle('costs',function(x){return x.id===cid;},null);return;}
  if((el=t.closest('[data-secttog]'))){
    var sect=el.dataset.secttog, pth=S.fin.path||'rent';
    var anyOn=S.fin.costs.some(function(c){
      return c.section===sect&&costInPath(c,pth)&&finLive(c);});
    finToggle('costs',function(c){return c.section===sect&&costInPath(c,pth);},!anyOn);
    return;}
  if((el=t.closest('[data-whotog]'))){
    var wk=el.dataset.whotog;
    var onNow=S.fin.jobs.some(function(j){return j.who===wk&&finLive(j);});
    finToggle('jobs',function(j){return j.who===wk;},!onNow);
    return;}
  if((el=t.closest('[data-alltog]'))){
    var ap=el.dataset.alltog.split('|'), want=ap[1]==='1';
    var pth2=S.fin.path||'rent';
    var moved=finToggle(ap[0],ap[0]==='costs'
      ?function(c){return costInPath(c,pth2);}
      :function(){return true;},want);
    if(!moved) toast(want?'Everything was already counted':'Everything was already off');
    return;}
  if((el=t.closest('[data-shd]'))){S.fin.shifts=S.fin.shifts.filter(function(x){
    return x.id!==el.dataset.shd;});save();route();return;}
  if((el=t.closest('[data-scload]'))){
    if(scenDirty()&&!confirm('Unsaved changes will be lost. Continue?')){return;}
    scenLoad(el.dataset.scload);route();toast('Opened '+el.dataset.scload);return;}
  if((el=t.closest('[data-scdel]'))){
    if(confirm('Delete scenario "'+el.dataset.scdel+'"?')){
      delete S.fin.scenarios[el.dataset.scdel];
      if(S.fin.activeScenario===el.dataset.scdel)S.fin.activeScenario=null;
      save();route();}return;}
  if((el=t.closest('[data-bpadd]'))){bpItemEditor(el.dataset.bpadd,null);return;}
  if((el=t.closest('[data-bple]'))){bpListEditor(el.dataset.bple);return;}
  if((el=t.closest('[data-bpdel]'))){var bn=el.dataset.bpdel;
    if(confirm('Delete the list "'+bn+'" and everything on it?')){
      delete S.fin.purchases[bn];save();route();}return;}
  if((el=t.closest('[data-bpie]'))){var pe=el.dataset.bpie.split('|');
    bpItemEditor(pe[0],+pe[1]);return;}
  if((el=t.closest('[data-bpi]'))){var p=el.dataset.bpi.split('|');
    S.fin.purchases[p[0]].items.splice(+p[1],1);save();route();return;}

  /* strategies */
  if((el=t.closest('[data-stadd]'))){stratEditor(el.dataset.stadd,null);return;}
  if((el=t.closest('[data-stle]'))){stratListEditor(el.dataset.stle);return;}
  if((el=t.closest('[data-stdel]'))){var sn=el.dataset.stdel;
    if(confirm('Delete the list "'+sn+'" and every strategy on it?')){
      delete S.fin.strategies[sn];save();route();}return;}
  if((el=t.closest('[data-stie]'))){var se=el.dataset.stie.split('|');
    stratEditor(se[0],+se[1]);return;}
  if((el=t.closest('[data-stid]'))){var sd=el.dataset.stid.split('|');
    if(confirm('Delete this strategy?')){
      S.fin.strategies[sd[0]].items.splice(+sd[1],1);save();route();}return;}

  /* planning */
  if((el=t.closest('[data-plgo]'))){nav('planning/'+el.dataset.plgo);return;}
  if((el=t.closest('[data-ple]'))){planColEditor(el.dataset.ple);return;}
  if((el=t.closest('[data-pld]'))){var pc=planCol(el.dataset.pld);
    if(pc&&confirm('Delete "'+pc.name+'" and every section in it?')){
      S.plan.cols=S.plan.cols.filter(function(x){return x.id!==el.dataset.pld;});
      save();nav('planning');}return;}
  if((el=t.closest('[data-plsadd]'))){planSubEditor(el.dataset.plsadd,null);return;}
  if((el=t.closest('[data-plse]'))){var q=el.dataset.plse.split('|');
    planSubEditor(q[0],q[1]);return;}
  if((el=t.closest('[data-plsd]'))){var qd=el.dataset.plsd.split('|');
    var pcol=planCol(qd[0]), psub=planSub(qd[0],qd[1]);
    if(pcol&&psub&&confirm('Delete the section "'+psub.name+'"?')){
      pcol.subs=pcol.subs.filter(function(x){return x.id!==qd[1];});save();route();}return;}
  if((el=t.closest('[data-pliadd]'))){var ia=el.dataset.pliadd.split('|');
    planItemEditor(ia[0],ia[1],null);return;}
  if((el=t.closest('[data-plie]'))){var ie=el.dataset.plie.split('|');
    planItemEditor(ie[0],ie[1],ie[2]);return;}
  if((el=t.closest('[data-plid]'))){var idl=el.dataset.plid.split('|');
    var dsub=planSub(idl[0],idl[1]);
    if(dsub){dsub.items=dsub.items.filter(function(x){return x.id!==idl[2];});save();route();}
    return;}
  if((el=t.closest('[data-plck]'))){var ck=el.dataset.plck.split('|');
    var csub=planSub(ck[0],ck[1]);
    if(csub){csub.items.forEach(function(x){ if(x.id===ck[2]) x.done=el.checked; });
      save();
      /* Repaint just this row and the counters, so ticking a box does not
         scroll the page back to the top mid-list. */
      var row=el.closest('.pitem'); if(row) row.classList.toggle('done',el.checked);
      var c2=planCol(ck[0]);
      if(c2){var n2=planCount(c2);
        $$('.stat b').forEach(function(b,i){ if(i===0)b.textContent=n2.pct+'%';
          if(i===1)b.textContent=n2.done; if(i===2)b.textContent=n2.total-n2.done; });
        var sd2=(csub.items||[]).filter(function(x){return x.done;}).length;
        var chip=row&&row.closest('.sec')&&row.closest('.sec').querySelector('.chip.p');
        if(chip) chip.textContent=sd2+' / '+csub.items.length;}}
    return;}
  if((el=t.closest('[data-d]'))){calSel=el.dataset.d;route();return;}
  if((el=t.closest('[data-evd]'))){dayLog(calSel).sched.splice(+el.dataset.evd,1);save();route();return;}
  if((el=t.closest('[data-spd]'))){dayLog(calSel).spend.splice(+el.dataset.spd,1);save();route();return;}
  if((el=t.closest('[data-mld]'))){dayLog(calSel).meals.splice(+el.dataset.mld,1);save();route();return;}
  if((el=t.closest('[data-tadd]'))){var ta=el.dataset.tadd.split('|');
    tmplEditor(ta[0],+ta[1]);return;}
  if((el=t.closest('[data-td]'))){var q=el.dataset.td.split('|');
    var tc=tmplCol(q[0]);
    if(tc&&tc.days&&tc.days[q[1]]){tc.days[q[1]].splice(+q[2],1);save();route();}
    return;}
  /* template collections */
  if((el=t.closest('[data-tcopen]'))){nav('schedule/templates/'+el.dataset.tcopen);return;}
  if((el=t.closest('[data-tcedit]'))){tmplColEditor(el.dataset.tcedit);return;}
  if((el=t.closest('[data-tcapply]'))){tmplApplyModal(el.dataset.tcapply);return;}
  if((el=t.closest('[data-tctoggle]'))){var tt=tmplCol(el.dataset.tctoggle);
    if(tt){ if(!tt.active&&(tt.repeat||'weekly')==='once'){
        toast('Set it to repeat before it can run'); tmplColEditor(tt.id); return; }
      tt.active=!tt.active; save(); route();
      toast(tt.active?'"'+tt.name+'" is running':'"'+tt.name+'" stopped'); }
    return;}
  if((el=t.closest('[data-tcfav]'))){var tf=tmplCol(el.dataset.tcfav);
    if(tf){tf.fav=!tf.fav;save();route();} return;}
  if((el=t.closest('[data-tcdel]'))){var tdc=tmplCol(el.dataset.tcdel);
    if(tdc&&confirm('Delete "'+tdc.name+'"? Days it already wrote onto the calendar stay.')){
      S.sched.cols=tmplCols().filter(function(x){return x.id!==el.dataset.tcdel;});
      save();nav('schedule/templates');}
    return;}
  if(t.closest('#syncPill')){
    if(syncOn){syncFlush();syncPull();toast('Syncing');} else settingsModal(); return;}
  if(t.closest('#settings')){settingsModal();return;}
  }catch(err){ if(window.console&&console.error)console.error('click',err);
    toast('Something went wrong: '+(err.message||err)); }
});

function shopItemEditor(idx){
  var it=curList().items[idx];
  var m=modal('Edit '+it.name,
    form([{id:'sen',l:'Name',v:it.name},
      {id:'seq',l:'Qty',t:'number',step:'0.5',v:it.qty},
      {id:'sep',l:'Price each',t:'number',step:'0.01',v:it.price},
      {id:'sea',l:'Aisle',t:'select',o:AISLES.map(function(a){return [a[0],a[0]];}).concat([['Other','Other']]),v:it.aisle},
      {id:'sen2',l:'Note',v:it.note||''}])+
    (it.key?'<p class="sm muted">Changing the price here only affects this list. To change it '+
      'everywhere, edit it in the <a href="#/shopping/ingredients">ingredient list</a>.</p>':''),
    '<button class="b o dz" id="seDel">Remove</button>'+
    '<button class="b o" data-close>Cancel</button><button class="b" id="seSave">Save</button>');
  $('#seDel',m).onclick=function(){curList().items.splice(idx,1);save();m.remove();route();};
  $('#seSave',m).onclick=function(){
    it.name=$('#sen',m).value;it.qty=num($('#seq',m).value,1);it.price=num($('#sep',m).value);
    it.aisle=$('#sea',m).value;it.note=$('#sen2',m).value;save();m.remove();route();};
}
function listModal(id){

    return '<div class="pickrow" data-l="'+E(n)+'"><input type="checkbox"'+(has?' checked':'')+
    ' style="width:18px;height:18px;accent-color:var(--brass)"><div><b>'+E(n)+'</b>'+
    '<div class="xs muted">'+S.lists[n].length+' recipes</div></div></div>';}).join('')
    :'<p class="sm muted">No recipe lists yet.</p>')+
   '<label class="f" style="margin-top:14px"><span>Or make a new one</span><input id="nl" placeholder="Sunday prep"></label>';
  var m=modal('Add to a recipe list',body,
    '<button class="b o" data-close>Cancel</button><button class="b" id="lS">Save</button>');
  $('#lS',m).onclick=function(){
    $$('.pickrow',m).forEach(function(r){var n=r.dataset.l;if(!n)return;
      var on_=r.querySelector('input').checked,i=S.lists[n].indexOf(id);
      if(on_&&i<0)S.lists[n].push(id); if(!on_&&i>=0)S.lists[n].splice(i,1);});
    var nl=$('#nl',m).value.trim();
    if(nl){if(!S.lists[nl])S.lists[nl]=[];if(S.lists[nl].indexOf(id)<0)S.lists[nl].push(id);}
    save();m.remove();toast('Saved');};
}
function pickPhoto(id){
  var inp=document.createElement('input');inp.type='file';inp.accept='image/*';
  inp.onchange=function(){var f=inp.files[0];if(!f)return;
    var fr=new FileReader();
    fr.onload=function(){var img=new Image();
      img.onload=function(){var sc=Math.min(1,900/Math.max(img.width,img.height));
        var cv=document.createElement('canvas');cv.width=img.width*sc|0;cv.height=img.height*sc|0;
        cv.getContext('2d').drawImage(img,0,0,cv.width,cv.height);
        S.photos[id]=cv.toDataURL('image/jpeg',0.72);save();route();toast('Photo saved');};
      img.src=fr.result;};
    fr.readAsDataURL(f);};
  inp.click();
}
function ownRecipe(){

    form([{id:'on',l:'Name',v:''},
      {id:'oc',l:'Category',t:'select',o:[['Breakfast','Breakfast'],['Lunch/Dinner','Mains'],

      {id:'osv',l:'Servings',t:'number',v:2},{id:'ot',l:'Minutes',t:'number',v:20},
      {id:'ok',l:'Kcal / serving',t:'number',v:''},{id:'op',l:'Protein g',t:'number',v:''},
      {id:'ocb',l:'Carbs g',t:'number',v:''},{id:'of',l:'Fat g',t:'number',v:''},
      {id:'ocost',l:'Cost / serving',t:'number',step:'0.01',v:''},

      diff:'MODERATE',k:num($('#ok',m).value),p:num($('#op',m).value),c:num($('#ocb',m).value),
      f:num($('#of',m).value),fib:0,leu:0,tg:['MY RECIPE'],cw:c*sv,cws:c,cc:c*sv,ccs:c,
      ing:$('#oi',m).value.split('\n').filter(Boolean).map(function(l){return [l.trim(),'',0];}),
      st:$('#os',m).value.split('\n').filter(Boolean),storage:'',prep:'',subs:[],vars:[]});
    save();m.remove();route();toast('Recipe saved');};
}
function cardPNG(r){
  if(!r)return;
  var W=900,H=1280,cv=document.createElement('canvas');cv.width=W;cv.height=H;
  var x=cv.getContext('2d'),col=CATC[r.cat]||CATC['My recipe'];
  var g=x.createLinearGradient(0,0,W,H);g.addColorStop(0,'#14140F');g.addColorStop(.58,'#1F3A2C');g.addColorStop(1,col[1]);
  x.fillStyle=g;x.fillRect(0,0,W,H);x.fillStyle=col[0];x.fillRect(0,0,W,9);
  x.fillStyle='#A8CDB8';x.font='700 19px Helvetica,Arial';
  x.fillText(r.id+'   \u00B7   '+r.cat.toUpperCase()+'   \u00B7   '+r.diff,56,80);
  x.fillStyle='#fff';x.font='800 52px Helvetica,Arial';
  var y=142+wrapT(x,r.n,56,142,780,56);
  var mac=[[Math.round(r.k),'KCAL'],[Math.round(r.p)+'g','PROTEIN'],[Math.round(r.c)+'g','CARBS'],
           [Math.round(r.f)+'g','FAT'],[Math.round(r.fib||0)+'g','FIBER'],[(r.leu||0).toFixed(1)+'g','LEUCINE']];
  var bw=(788-25)/6;
  mac.forEach(function(mm,i){var bx=56+i*(bw+5);
    x.fillStyle='rgba(255,255,255,.10)';x.fillRect(bx,y,bw,90);
    x.fillStyle='#fff';x.font='800 25px Helvetica,Arial';x.textAlign='center';
    x.fillText(String(mm[0]),bx+bw/2,y+40);
    x.fillStyle='#A8CDB8';x.font='700 11px Helvetica,Arial';x.fillText(mm[1],bx+bw/2,y+66);x.textAlign='left';});
  y+=128;
  x.fillStyle='#1F4D3A';x.fillRect(56,y,788,62);x.fillStyle='#fff';x.font='700 23px Helvetica,Arial';
  x.fillText(r.t+' min   \u00B7   makes '+r.sv+'   \u00B7   '+$$$(cps(r))+'/serving   \u00B7   '+$$$(ctot(r))+' batch',78,y+39);
  y+=100;
  x.fillStyle='#A8CDB8';x.font='700 16px Helvetica,Arial';x.fillText('INGREDIENTS',56,y);y+=28;
  x.fillStyle='#E6EDE7';x.font='400 18px Helvetica,Arial';
  (r.ing||[]).slice(0,15).forEach(function(i){var q=ING(i[1]);
    x.fillText('\u2022  '+(i[2]?Math.round(i[2])+' g  ':'')+(q?q.n:i[0]),56,y);y+=26;});
  y+=20;x.fillStyle='#A8CDB8';x.font='700 16px Helvetica,Arial';x.fillText('METHOD',56,y);y+=28;
  x.fillStyle='#C9D6CB';x.font='400 16px Helvetica,Arial';
  (r.st||[]).slice(0,6).forEach(function(s,i){y+=wrapT(x,(i+1)+'. '+s,56,y,788,23)+7;});
  x.fillStyle='#6E8A76';x.font='700 13px Helvetica,Arial';x.fillText('The Handbook',56,H-40);
  var a=document.createElement('a');
  a.download=r.id+'-'+r.n.replace(/[^a-z0-9]+/gi,'-').toLowerCase()+'.png';
  a.href=cv.toDataURL('image/png');a.click();
}
function wrapT(x,t,px,py,mw,lh){var w=String(t).split(' '),line='',yy=py,used=0;
  for(var i=0;i<w.length;i++){var tt=line+w[i]+' ';
    if(x.measureText(tt).width>mw&&line){x.fillText(line,px,yy);line=w[i]+' ';yy+=lh;used+=lh;}else line=tt;}
  x.fillText(line,px,yy);return used+lh;}

/* Nothing draws until boot() has been round the API and knows who is looking.
   Painting first and filling in afterwards means the first thing on screen is
   either nobody's data or somebody else's. boot() is called at the bottom of
   the bundle, after every module is defined. */
try{ applyTheme(); }catch(e){}
if(!location.hash)location.hash='#/meals';
/* A baseline of every branch before anything can change, so the first save
   does not stamp the whole document as freshly edited. */
try{ syncTouch(); }catch(e){}
window.onerror=function(msg,src,ln,col,err){
  var v=$('#view');
  if(v&&!v.innerHTML){ v.innerHTML=errPanel('The app',err||{message:msg}); }
  return false;
};

boot();
})();
