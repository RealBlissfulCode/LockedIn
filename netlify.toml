# One self-contained file. No build step, no dependencies, nothing to install.
[build]
  publish = "."
  command = ""

# The API has to 404 rather than fall through to the app, otherwise a missing
# endpoint answers with index.html and a 200 and the browser gets HTML where it
# wanted JSON. Netlify serves no PHP at all, so this is also the honest answer
# there: the API only exists on a host that runs it.
[[redirects]]
  from = "/api/*"
  to = "/api/:splat"
  status = 404

# Hash routing means deep paths are never requested from the server,
# but this covers anyone typing one in.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=(self)"
    X-Robots-Tag = "noindex, nofollow, noarchive"

# Never cache the app itself. A redeploy is live immediately.
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/icons/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
